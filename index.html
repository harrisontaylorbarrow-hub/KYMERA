const K6_GLOSSARY={
 'Attack':'Use an offensive card or ability against a target defence.', 'Move':'Change your position by the listed number of spaces while obeying terrain and movement rules.', 'Top Action':'The upper half of a played card. Only one Top Action may be used in a turn.', 'Bottom Action':'The lower half of a played card. Only one Bottom Action may be used in a turn.', 'Initiative':'A card determines when you act in the round. Lower initiative acts earlier.', 'Initiative Modifier':'If a card shows an initiative roll icon, roll the indicated die and add its modifier when determining initiative.', 'Hand':'The cards currently available to you. KYMERA uses a maximum hand size of 7.', 'Discard':'Cards spent during combat. When your draw pile is empty, your discard becomes the new draw pile and is shuffled.', 'Recover':'Skip your turn to refill your hand to 7 and choose two recovery benefits.', 'Recovery Play':'Spend one of your two card-play actions to draw 2 cards and restore 1 Reservoir.', 'Card Category':'The tactical category of a card half. You cannot use two effects from the same category in the same turn.', 'Element Symbol':'The B, M or S symbol printed on a card. It determines which Reservoir channel may power your elemental ability this turn.', 'Body':'The physical expression of an attuned element.', 'Mind':'The analytical, perceptive and tactical expression of an attuned element.', 'Soul':'The identity, life-force, spatial and fate expression of an attuned element.', 'Push':'Move a target away from the acting creature by the listed number of spaces.', 'Pull':'Move a target toward the acting creature by the listed number of spaces.', 'Knockdown':'The target becomes Prone/Knocked Down and must spend movement or an action to recover, as defined by the encounter.', 'Exposed':'The target is vulnerable; attacks against it gain +2 until the condition is cleared.', 'Marked':'The target is easier to track and exploit; the marking effect states its exact bonus.', 'Shielded':'Reduce incoming damage by the listed Shield value or by the current Shield rule on the source.', 'Burning':'The target suffers ongoing Heat damage at the end of its turn until cleared.', 'Frozen':'The target is Slowed and cannot benefit from movement bonuses until cleared.', 'Shocked':'The target suffers -1 on its next roll and cannot use a Reaction until that roll resolves.', 'Stunned':'The target loses its next Action.', 'Rooted':'The target cannot voluntarily Move.', 'Silenced':'The target cannot use Power/elemental abilities.', 'Frightened':'The target cannot willingly move closer to the source of fear.', 'Overload':'A pressure track created when Reservoir is pushed beyond safe capacity.', 'Hope':'A player resource used to reroll, assist an ally, or reduce an Overload result by 1.', 'Reservoir':'The Body, Mind and Soul fuel pools used by elemental abilities.', 'Synthesis':'Combining compatible elemental properties to create an emergent effect.', 'Evasion':'Defence against attacks that rely on speed, aim or positioning.', 'Resistance':'Defence against physical or energetic force.', 'Will':'Defence against mental and soul pressure.', 'Cover':'Terrain that grants +2 Evasion while it meaningfully blocks the attacker.', 'High Ground':'A positional advantage that grants +1 on ranged rolls.', 'Line of Sight':'A clear visual path between source and target.', 'Line of Effect':'A clear path for the effect to travel between source and target.', 'Deck':'Your constructed combat library. At Level 1 it contains 15 cards and can grow to 25.', 'Card Slot':'A permanent place in your deck. New slots unlock at Levels 2, 4, 6, 8, 10, 12, 14, 16, 18 and 20.', 'Equipment Slot':'A persistent loadout location: Helmet, Body, Hands, Legs, Other, Main Hand and Off Hand.', 'Post-Combat Event':'A narrative event resolved after a mission that can grant benefits or create lasting consequences.'
};
function k6LinkText(text){let out=esc(text);for(const term of Object.keys(K6_GLOSSARY).sort((a,b)=>b.length-a.length)){const re=new RegExp('\\b'+term.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\b','gi');out=out.replace(re,m=>`<button class="ref-link k6ref" onclick="k6OpenRef('${esc(term)}')">${m}</button>`)}return out}
function k6OpenRef(term){const key=Object.keys(K6_GLOSSARY).find(k=>k.toLowerCase()===String(term).toLowerCase())||term;document.getElementById('modalbox').innerHTML=`<div class="between"><div><div class="kicker">Reference</div><h2>${esc(key)}</h2></div><button class="btn" onclick="closeModal()">×</button></div><div class="detailbox section"><p>${k6LinkText(K6_GLOSSARY[key]||'No definition recorded.')}</p></div><button class="btn primary section" onclick="closeModal();setPage('reference')">Open Reference</button>`;document.getElementById('modal').classList.add('open')}
window.k6OpenRef=k6OpenRef;
function k6RenderReference(){const q=(state.search.reference||'').toLowerCase();const rows=Object.entries(K6_GLOSSARY).filter(([k,v])=>(k+' '+v).toLowerCase().includes(q));document.getElementById('reference').innerHTML=`<div class="between"><div><div class="kicker">Rules dictionary</div><h1 class="title">Reference</h1><p class="subtitle">Search names, phrases or definitions. Tactical terms throughout KYMERA link back here.</p></div><span class="pill">${rows.length} matches</span></div><div class="card section"><input autofocus placeholder="Search Push, Initiative, Recovery, Reservoir…" value="${esc(state.search.reference||'')}" oninput="state.search.reference=this.value;k6RenderReference()"></div><div class="grid g2 section">${rows.map(([k,v])=>`<article class="card"><div class="between"><h2>${esc(k)}</h2><button class="pill" onclick="k6OpenRef('${esc(k)}')">Open</button></div><p>${k6LinkText(v)}</p></article>`).join('')||'<div class="empty">No matching reference terms.</div>'}</div>`}
function k6CardView(card,idx,hand=true){const top=card.top||{cat:card.cat,text:card.top||''},bottom=card.bottom||{cat:card.cat,text:card.bottom||''};return `<article class="combat-card ${card.element?'element-card':'universal-card'}"><div class="card-initiative"><span class="initiative-icon">${card.initiativeMode==='roll'?'◌':'◈'}</span><b>${card.initiativeMode==='roll'?`${card.initiativeDie}${card.initiativeMod>=0?'+':''}${card.initiativeMod}`:(card.initiative||'—')}</b></div><div class="card-symbol">${esc(card.slotSymbol||'B')}</div><div class="card-title"><b>${esc(card.name)}</b><span class="pill">${esc(card.elementName||'Universal')}</span></div><div class="card-half top-half"><div class="between"><span class="card-half-label">TOP · ${esc(top.cat)}</span><span class="pill">${esc(card.slotSymbol||'')}</span></div><p>${k6LinkText(top.text)}</p>${hand?`<div class="toolbar"><button class="btn primary" onclick="k6PlayHalf('${esc(card.instance||card.id)}','top')">Use Top</button><button class="btn" onclick="k6MoveInstead('${esc(card.instance||card.id)}','top')">Move Instead</button></div>`:''}</div><div class="card-divider"></div><div class="card-half bottom-half"><div class="between"><span class="card-half-label">BOTTOM · ${esc(bottom.cat)}</span><span class="pill">${esc(card.slotSymbol||'')}</span></div><p>${k6LinkText(bottom.text)}</p>${hand?`<div class="toolbar"><button class="btn primary" onclick="k6PlayHalf('${esc(card.instance||card.id)}','bottom')">Use Bottom</button><button class="btn" onclick="k6MoveInstead('${esc(card.instance||card.id)}','bottom')">Move Instead</button></div>`:''}</div></article>`}
function k6RenderDeck(){k6NormaliseCharacter();const ch=state.character,c=state.creator,codes=Object.values(c.slots).filter(Boolean),hand=ch.hand,draw=ch.draw||[],discard=ch.discard||[],slots=k6MaxDeck(ch.level),selected=ch.deck.map(x=>x.id);document.getElementById('deck').innerHTML=`<div class="between"><div><div class="kicker">Gloomhaven-inspired tactical card system</div><h1 class="title">Combat Deck</h1><p class="subtitle">Hand 7 · Level 1 deck 15 · maximum deck 25. Every played card has a Top and Bottom, a category, an initiative value and a Body/Mind/Soul channel.</p></div><div class="toolbar"><button class="btn" onclick="k6StartCombat()">Draw Hand</button><button class="btn primary" onclick="k6RecoverTurn()">Recover Hand</button></div></div><div class="grid g4 section"><div class="stat"><span class="small muted">Deck</span><b>${ch.deck.length}/${slots}</b><div class="small muted">Level ${ch.level}</div></div><div class="stat"><span class="small muted">Hand</span><b>${hand.length}/7</b><div class="small muted">Current cards</div></div><div class="stat"><span class="small muted">Draw</span><b>${draw.length}</b><div class="small muted">Ready to play</div></div><div class="stat"><span class="small muted">Discard</span><b>${discard.length}</b><div class="small muted">Spent cards</div></div></div><div class="card section"><div class="between"><h2>Your hand</h2><span class="pill">${hand.length} cards</span></div><div class="combat-card-grid section">${hand.map((x,i)=>k6CardView(x,i,true)).join('')||'<div class="empty">No cards in hand. Draw a hand or recover.</div>'}</div></div><div class="grid g2 section"><div class="card"><h2>Deck builder</h2><p class="small muted">Your Level ${ch.level} deck has ${slots} slots. Start with 15; add exactly one card slot at each even level. Each attuned element contributes a pool. The first seven choices are five universal cards plus two element-specific cards.</p><div class="tags">${codes.map(x=>`<span class="pill">${esc(elem(x)[1])}</span>`).join('')}</div><div class="toolbar section"><button class="btn primary" onclick="k6OpenDeckBuilder()">Open Deck Builder</button><button class="btn" onclick="k6ResetDeck()">Reset to legal starting deck</button></div></div><div class="card"><h2>Turn rules</h2><p class="small">Play up to two cards. Choose one Top from one played card and one Bottom from the other. You may not use two halves from the same category. You may replace a card half with movement. At least one played card's B/M/S symbol may channel one elemental ability from the matching attuned slot.</p><div class="tags">${['Top Action','Bottom Action','Initiative','Card Category','Element Symbol','Move','Recovery Play','Recover'].map(k6Ref).join(' ')}</div></div></div>`}
function k6OpenDeckBuilder(){const ch=state.character,codes=Object.values(state.creator.slots).filter(Boolean),pools=codes.map(code=>({code,cards:k6Pool(code).filter(x=>x.unlockLevel<=ch.level),count:ch.deck.filter(x=>x.poolElement===code).length}));const html=pools.map(pool=>`<div class="card section"><div class="between"><h3>${esc(elem(pool.code)[1])} pool</h3><span class="pill">${pool.count}/${ch.level===1?5:'any'}</span></div><div class="grid g2 section">${pool.cards.map(card=>`<button class="choice ${ch.deck.some(x=>x.id===card.id)?'selected':''}" onclick="k6ToggleDeckCard('${esc(card.id)}')"><div class="between"><b>${esc(card.name)}</b><span class="pill">${card.element?'Element':'Universal'}</span></div><div class="tags"><span class="pill">${esc(card.slotSymbol)}</span><span class="pill">Init ${card.initiative}</span><span class="pill">Lv ${card.unlockLevel}</span></div><div class="desc"><b>Top · ${esc(card.top.cat)}</b> — ${esc(card.top.text)}</div><div class="desc section"><b>Bottom · ${esc(card.bottom.cat)}</b> — ${esc(card.bottom.text)}</div></button>`).join('')}</div></div>`).join('');document.getElementById('modalbox').innerHTML=`<div class="between"><div><div class="kicker">Deck Builder · ${ch.deck.length}/${k6MaxDeck(ch.level)}</div><h2>${ch.level===1?'Build your starting deck':'Evolve your combat deck'}</h2></div><button class="btn" onclick="closeModal()">×</button></div><p class="small muted">Level 1: choose exactly 5 cards from each of your three attuned element pools. Each pool contains 7 starting choices: 5 universal cards plus 2 element-specific cards. At each later even level, one new slot unlocks and you add one newly unlocked card from any one of your three pools.</p>${html}<button class="btn primary section" onclick="k6FinishDeckBuild()">${ch.level===1?'Finish 15-card starting deck':'Finish deck'}</button>`;document.getElementById('modal').classList.add('open')}
function k6FinishDeckBuild(){const ch=state.character;if(ch.level===1){const codes=Object.values(state.creator.slots).filter(Boolean);if(ch.deck.length!==15||codes.some(code=>ch.deck.filter(x=>x.poolElement===code).length!==5))return toast('Choose exactly 5 cards from each of your three element pools.')}else if(ch.deck.length!==k6MaxDeck(ch.level))return toast(`Choose cards until your deck has ${k6MaxDeck(ch.level)} cards.`);closeModal();save();k6RenderDeck();toast('Deck saved.')}
function k6ToggleDeckCard(id){const ch=state.character,card=k6CardById(id);if(!card)return;const ix=ch.deck.findIndex(x=>x.id===id);if(ix>=0){ch.deck.splice(ix,1);save();k6OpenDeckBuilder();return}if(ch.level===1){const pool=card.poolElement;const count=ch.deck.filter(x=>x.poolElement===pool).length;if(count>=5)return toast(`Your ${elem(pool)[1]} starting pool already has 5 cards.`);if(ch.deck.length>=15)return toast('Your starting deck must contain exactly 15 cards.');ch.deck.push({...card,instance:`${card.id}-${Date.now()}-${Math.random().toString(36).slice(2,6)}`});save();k6OpenDeckBuilder();return}if(ch.deck.length>=k6MaxDeck(ch.level))return toast('Your current deck is full.');ch.deck.push({...card,instance:`${card.id}-${Date.now()}-${Math.random().toString(36).slice(2,6)}`});save();k6OpenDeckBuilder()}
function k6ResetDeck(){const ch=state.character;ch.deck=k6InitCombatDeck();ch.deckSlots=k6MaxDeck(ch.level);ch.hand=[];ch.draw=[];ch.discard=[];save();toast('Deck reset to the legal starting configuration.');k6RenderDeck()}
function k6ShuffleDraw(){const ch=state.character;if(!ch.draw||!ch.draw.length){if(ch.discard&&ch.discard.length){ch.draw=shuffle(ch.discard);ch.discard=[]}else if(ch.deck.length){ch.draw=shuffle(ch.deck.map(x=>({...x,instance:`${x.id}-${Date.now()}-${Math.random().toString(36).slice(2,5)}`})))}}}
function k6Draw(n=1){const ch=state.character;k6ShuffleDraw();for(let i=0;i<n;i++){k6ShuffleDraw();if(!ch.draw.length)break;ch.hand.push(ch.draw.pop())}if(ch.hand.length>7)ch.hand=ch.hand.slice(0,7);save()}
function k6StartCombat(){const ch=state.character;ch.hand=[];ch.draw=shuffle(ch.deck.map(x=>({...x,instance:`${x.id}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`})));ch.discard=[];k6Draw(7);ch.activeCombat={round:1,initiative:null,selectedA:null,selectedB:null,topUsed:false,bottomUsed:false,elementUsed:false};save();k6RenderDeck();toast('Seven-card hand drawn.')}
function k6PlayedCount(){return (state.character.activeCombat?.played||[]).length}
function k6PlayHalf(instance,half){const ch=state.character,ac=ch.activeCombat||{};ac.played=ac.played||[];if(ac.played.length>=2)return toast('You have already played two cards this turn.');const card=ch.hand.find(x=>x.instance===instance);if(!card)return;if(ac.played.some(p=>p.instance===instance))return toast('That card is already committed this turn.');if(ac.played[0]&&ac.played[0].half===half)return toast('Each turn requires one Top and one Bottom effect.');const effect=card[half],other=ac.played[0]&&ac.played[0][ac.played[0].half];if(other&&other.cat===effect.cat)return toast('You cannot use two effects from the same category.');ac.played.push({instance,half,cardId:card.id,cat:effect.cat,initiative:card.initiative,initiativeMode:card.initiativeMode,initiativeMod:card.initiativeMod});ac.elementSymbols=Array.from(new Set(ac.played.map(p=>{const x=ch.hand.find(c=>c.instance===p.instance);return x.slotSymbol})));ch.combatStats.cardsPlayed=(ch.combatStats.cardsPlayed||0)+1;ch.hand=ch.hand.filter(x=>x.instance!==instance);ch.discard.push(card);save();toast(`${card.name}: ${half.toUpperCase()} used.`);k6RenderDeck()}
function k6MoveInstead(instance,half){const ch=state.character,ac=ch.activeCombat||{};ac.played=ac.played||[];if(ac.played.length>=2)return toast('You have already played two cards this turn.');const card=ch.hand.find(x=>x.instance===instance);if(!card)return;if(ac.played.some(p=>p.instance===instance))return toast('That card is already committed this turn.');if(ac.played[0]&&ac.played[0].half===half)return toast('Each turn requires one Top and one Bottom effect.');ac.played.push({instance,half,cardId:card.id,cat:'Movement',moveInstead:true,initiative:card.initiative,initiativeMode:card.initiativeMode,initiativeMod:card.initiativeMod});ch.hand=ch.hand.filter(x=>x.instance!==instance);ch.discard.push(card);save();toast(`${card.name}: movement substituted for the ${half} action.`);k6RenderDeck()}
function k6RecoveryPlay(){const ch=state.character,ac=ch.activeCombat||{};ac.played=ac.played||[];if(ac.played.length>=2)return toast('No card-play action remaining.');if(ch.hand.length<1)return toast('You need a card in hand.');k6Draw(2);ch.res.body=clamp((ch.res.body||0)+1,0,8);ac.played.push({instance:'recovery-'+Date.now(),half:'recovery',cardId:null,cat:'Support'});save();toast('Recovery Play: drew 2 and restored 1 Reservoir.');k6RenderDeck()}
function k6RecoverTurn(){const ch=state.character;const choices=[['hope','+1 Hope'],['reservoir','Restore 2 Reservoir'],['heal','Heal 2 HP'],['overload','Clear 1 Overload'],['statuses','Clear negative statuses']];const picks=ch.recoveryPicks||[];document.getElementById('modalbox').innerHTML=`<div class="between"><div><div class="kicker">Recover</div><h2>Skip your turn · refill to 7</h2></div><button class="btn" onclick="closeModal()">×</button></div><p>Choose exactly two benefits. Your current hand will be refreshed to seven cards.</p><div class="grid g2 section">${choices.map(([id,label])=>`<button class="choice ${picks.includes(id)?'selected':''}" onclick="k6ToggleRecovery('${id}')"><b>${label}</b><div class="desc">Choose this as one of your two recovery benefits.</div></button>`).join('')}</div><button class="btn primary section" onclick="k6ConfirmRecovery()">Confirm recovery</button>`;document.getElementById('modal').classList.add('open')}
function k6ToggleRecovery(id){const p=state.character.recoveryPicks||[];state.character.recoveryPicks=p.includes(id)?p.filter(x=>x!==id):p.length<2?[...p,id]:p;save();k6RecoverTurn()}
function k6ConfirmRecovery(){const ch=state.character,p=ch.recoveryPicks||[];if(p.length!==2)return toast('Choose exactly two recovery benefits.');ch.hand=[];ch.draw=shuffle(ch.deck.map(x=>({...x,instance:`${x.id}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`})));ch.discard=[];k6Draw(7);for(const x of p){if(x==='hope')ch.hope=clamp((ch.hope||0)+1,0,10);if(x==='reservoir'){ch.res.body=clamp((ch.res.body||0)+2,0,8)}if(x==='heal')ch.hp=clamp((ch.hp||0)+2,0,ch.maxHp||14);if(x==='overload')ch.overload=clamp((ch.overload||0)-1,0,5);if(x==='statuses')ch.conditions=[]}ch.recoveryPicks=[];ch.activeCombat={round:(ch.activeCombat?.round||1)+1,initiative:null,selectedA:null,selectedB:null,topUsed:false,bottomUsed:false,elementUsed:false,played:[]};save();closeModal();k6RenderDeck();toast('Recovered: hand refilled to seven.')}
function k6LevelSync(){const ch=state.character;const old=k6MaxDeck(ch.level-1),now=k6MaxDeck(ch.level);ch.deckSlots=now;if(now>old)toast(`Level ${ch.level}: +${now-old} combat deck slot unlocked.`)}
function k6ElementAbility(code,stage,slot){const e=elem(code),a=v4Ability(code,stage,slot);return {...a,element:e[1],symbol:e[0],slot}}
function k6UseElement(slot,stage){const ch=state.character,ac=ch.activeCombat||{};const code=state.creator.slots[slot];const a=k6ElementAbility(code,stage,slot);if(ch.level<a.level)return toast(`Element Stage ${stage} unlocks at Level ${a.level}.`);if(!(ac.played||[]).some(p=>{const card=ch.hand.find(x=>x.instance===p.instance)||k6CardById(p.cardId);return card&&card.slotSymbol===K6_SLOT_SYMBOL[slot]}))return toast(`Play a card showing ${K6_SLOT_SYMBOL[slot]} to channel ${slotLabel(slot)}.`);if(ac.elementUsed)return toast('Only one elemental ability may be used per turn.');if((ch.res?.[slot]||0)<a.cost)return toast(`Not enough ${slotLabel(slot)} Reservoir.`);ch.res[slot]-=a.cost;ac.elementUsed=true;ch.lastAbility=a.id;save();k6RenderDeck();toast(`${a.title} used.`)}
function k6RenderCombatOverlay(){const ch=state.character,ac=ch.activeCombat||{};const body=document.getElementById('combat');const symbols=Array.from(new Set((ac.played||[]).map(p=>{const c=ch.hand.find(x=>x.instance===p.instance)||k6CardById(p.cardId);return c?.slotSymbol}).filter(Boolean)));body.innerHTML=`<div class="between"><div><div class="kicker">KYMERA tactical combat</div><h1 class="title">Card Battle</h1><p class="subtitle">Initiative is determined by the cards you commit. Play two cards, choose Top/Bottom, then optionally channel one Body, Mind or Soul ability whose symbol was played.</p></div><div class="toolbar"><button class="btn" onclick="k6StartCombat()">New Round</button><button class="btn primary" onclick="k6RecoverTurn()">Recover</button></div></div><div class="grid g3 section"><div class="stat"><span class="small muted">Round</span><b>${ac.round||1}</b></div><div class="stat"><span class="small muted">Cards played</span><b>${(ac.played||[]).length}/2</b></div><div class="stat"><span class="small muted">Channels</span><b>${symbols.join(' · ')||'—'}</b></div></div><div class="card section"><h2>Elemental ability channel</h2><div class="grid g3">${['body','mind','soul'].map(slot=>{const code=state.creator.slots[slot],e=code&&elem(code);return `<div class="slot ${slot}"><span class="kicker">${slotLabel(slot)} · ${K6_SLOT_SYMBOL[slot]}</span><h3>${e?esc(e[1]):'—'}</h3>${e?[1,2,3].map(st=>{const a=k6ElementAbility(code,st,slot);return `<div class="item"><div class="between"><b>${esc(a.title)}</b><span class="pill">Lv ${a.level}</span></div><p class="small">${esc(a.effect)}</p><button class="btn" ${ch.level<a.level||ac.elementUsed?'disabled':''} onclick="k6UseElement('${slot}',${st})">Use ${a.cost} Reservoir</button></div>`}).join(''):'<div class="empty">No attunement.</div>'}</div>`}).join('')}</div></div><div class="card section"><h2>Hand</h2><div class="combat-card-grid">${ch.hand.map((x,i)=>k6CardView(x,i,true)).join('')||'<div class="empty">No cards in hand.</div>'}</div></div><div class="card section"><h2>Committed cards</h2>${(ac.played||[]).map(p=>`<div class="item"><b>${esc(k6CardById(p.cardId)?.name||'Recovery')}</b> · ${esc(p.half)} · ${esc(p.cat)} · Initiative ${p.initiativeMode==='roll'?`${p.initiativeDie||'d20'}${p.initiativeMod>=0?'+':''}${p.initiativeMod}`:(p.initiative||'—')}</div>`).join('')||'<div class="empty">No cards committed this round.</div>'}</div>`}
function k6RenderArsenal(){const q=(state.search.weapons||'').toLowerCase(),qt=(state.search.techniques||'').toLowerCase();const equip=(weapons||[]).map((w,i)=>normaliseWeapon(w,i));const ts=techniques||[];document.getElementById('arsenal').innerHTML=`<div class="kicker">Equipment & techniques</div><h1 class="title">Arsenal</h1><p class="subtitle">Equipment uses seven persistent slots: Helmet, Body, Hands, Legs, Other, Main Hand and Off Hand.</p><div class="grid g2 section"><div class="card"><div class="between"><h2>Equipment</h2><span class="pill">${equip.length}</span></div><input placeholder="Search equipment…" value="${esc(q)}" oninput="state.search.weapons=this.value;k6RenderArsenal()"><div class="list section">${equip.filter(w=>(w.name+' '+w.category+' '+(w.description||'')+' '+(w.tags||[]).join(' ')).toLowerCase().includes(q)).map(w=>`<div class="equip-card"><div class="between"><b>${esc(w.name)}</b><span class="pill">${esc(w.slot||'main')}</span></div><div class="tags">${(w.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><p class="small">${k6LinkText(w.description||w.special||'')}</p><button class="btn primary" onclick="k6AddEquipment('${esc(w.name)}')">Add to inventory</button></div>`).join('')}</div></div><div class="card"><div class="between"><h2>Techniques</h2><span class="pill">${ts.length}</span></div><input placeholder="Search techniques…" value="${esc(qt)}" oninput="state.search.techniques=this.value;k6RenderArsenal()"><div class="list section">${ts.filter(t=>(t.name+' '+(t.effect||'')+' '+(t.choice||'')).toLowerCase().includes(qt)).map(t=>`<div class="equip-card"><div class="between"><b>${esc(t.name)}</b><span class="pill">${esc(t.category)}</span></div><p class="small">${k6LinkText(t.effect||t.description||'')}</p><p class="small muted">${k6LinkText(t.choice||'')}</p><button class="btn primary" onclick="k6AddTechnique(${t.id})">Add to techniques</button></div>`).join('')}</div></div></div>`}
function k6NormaliseWeapon(w,i){if(typeof w==='string')return {id:`w${i+1}`,name:w,category:'Weapon',range:'Melee',damage:'2',type:'Physical',tags:['Weapon'],weight:1,slot:'other',description:'A KYMERA equipment item.'};const slot=w.slot||(['Melee','Ranged'].includes(w.category)?(i%3===0?'main':i%3===1?'off':'hands'):['helmet','body','hands','legs','other'][i%5]);return {...w,slot,description:w.description||w.special||`A ${w.category||'KYMERA'} item with ${w.damage||2} ${w.type||'Physical'} damage.`}}
function normaliseWeapon(w,i){return k6NormaliseWeapon(w,i)}
function k6AddEquipment(name){const w=(weapons||[]).map((x,i)=>normaliseWeapon(x,i)).find(x=>x.name===name);if(!w)return;const ch=state.character;ch.equipment=ch.equipment||[];if(!ch.equipment.some(x=>x.name===name))ch.equipment.push(w);save();toast(`${name} added to inventory.`);k6RenderCharacterEquipment()}
function k6AddTechnique(id){const t=(techniques||[]).find(x=>x.id===id);if(!t)return;const ch=state.character;ch.techniques=ch.techniques||[];if(!ch.techniques.some(x=>(typeof x==='object'?x.id:x)===id))ch.techniques.push(t);save();toast(`${t.name} added.`);k6RenderSheet()}
function k6Equip(i){const ch=state.character,it=typeof ch.equipment[i]==='object'?ch.equipment[i]:normaliseWeapon(ch.equipment[i],i);const slot=it.slot&&['helmet','body','hands','legs','other','main','off'].includes(it.slot)?it.slot:'other';ch.equipmentSlots=ch.equipmentSlots||{};ch.equipmentSlots[slot]=it.id||it.name;ch.equipment[i]=it;save();toast(`${it.name} equipped in ${slot}.`);k6RenderCharacterEquipment()}
function k6Unequip(slot){state.character.equipmentSlots[slot]=null;save();k6RenderCharacterEquipment()}
function k6RenderCharacterEquipment(){const ch=state.character;ch.equipment=ch.equipment||[];const slots={helmet:'Helmet',body:'Body',hands:'Hands',legs:'Legs',other:'Other',main:'Main Hand',off:'Off Hand'};document.getElementById('character').innerHTML=`<div class="card"><div class="between"><div><div class="kicker">Massive Darkness-inspired loadout</div><h1 class="title">Equipment</h1></div><button class="btn primary" onclick="setPage('arsenal')">Browse Arsenal</button></div><div class="equipment-grid section">${Object.entries(slots).map(([k,n])=>{const id=ch.equipmentSlots?.[k],it=ch.equipment.find(x=>(x.id||x.name)===id);return `<div class="equip-slot ${it?'filled':''}"><span class="kicker">${n}</span><h3>${esc(it?.name||'Empty')}</h3>${it?`<p class="small">${k6LinkText(it.description||it.special||'')}</p><button class="btn" onclick="k6Unequip('${k}')">Unequip</button>`:'<span class="small muted">Empty slot</span>'}</div>`}).join('')}</div><h2 class="section">Inventory</h2><div class="list">${ch.equipment.map((x,i)=>{const it=typeof x==='object'?x:normaliseWeapon(x,i);return `<div class="equip-card"><div class="between"><b>${esc(it.name)}</b><span class="pill">${esc(it.slot||'other')}</span></div><p class="small">${k6LinkText(it.description||it.special||'')}</p><div class="toolbar"><button class="btn primary" onclick="k6Equip(${i})">Equip</button><button class="btn danger" onclick="chRemoveEquipment(${i})">Remove</button></div></div>`}).join('')||'<div class="empty">Inventory empty.</div>'}</div></div>`}
function chRemoveEquipment(i){state.character.equipment.splice(i,1);save();k6RenderCharacterEquipment()}
function k6RenderSheet(){k6NormaliseCharacter();const c=state.creator,ch=state.character,tab=ch.activeTab||'sheet',d=v4Derived();document.getElementById('character').innerHTML=`<div class="between"><div><div class="kicker">Interactive character sheet</div><div class="sheetname">${esc(c.name||'Unnamed')}</div><div class="muted">Level ${ch.level} · ${esc(c.archetype||'—')} · ${esc(c.specialisation||'—')}</div></div><div class="toolbar"><button class="btn primary" onclick="setPage('deck')">Combat Deck</button><button class="btn" onclick="openLevelModal()">Progression</button><button class="btn" onclick="startCreator()">Edit creation</button></div></div><div class="sheetnav">${[['sheet','Overview'],['elements','Elements'],['techniques','Techniques'],['equipment','Equipment'],['story','Story']].map(([id,n])=>`<button class="btn ${tab===id?'active':''}" onclick="state.character.activeTab='${id}';save();k6RenderSheet()">${n}</button>`).join('')}</div>${tab==='equipment'?k6EquipmentHtml():tab==='techniques'?k6TechniquesHtml():tab==='elements'?k6ElementsHtml():tab==='story'?sheetStory():k6OverviewHtml(d)}`}
function k6OverviewHtml(d){const ch=state.character,c=state.creator;return `<div class="sheethero"><div class="card"><div class="resourcegrid"><div class="stat"><span class="small muted">HP</span><b>${ch.hp}/${ch.maxHp}</b><div class="toolbar"><button class="btn" onclick="chHp(-1)">−</button><button class="btn" onclick="chHp(1)">+</button></div></div><div class="stat"><span class="small muted">Hope</span><b>${ch.hope}</b><div class="toolbar"><button class="btn" onclick="ch.hope=clamp(ch.hope-1,0,10);save();k6RenderSheet()">−</button><button class="btn" onclick="ch.hope=clamp(ch.hope+1,0,10);save();k6RenderSheet()">+</button></div></div><div class="stat"><span class="small muted">Overload</span><b>${ch.overload}/5</b><div class="toolbar"><button class="btn" onclick="ch.overload=clamp(ch.overload-1,0,5);save();k6RenderSheet()">−</button><button class="btn" onclick="ch.overload=clamp(ch.overload+1,0,5);save();k6RenderSheet()">+</button></div></div></div><h2 class="section">Reservoir</h2><div class="resourcegrid">${['body','mind','soul'].map(s=>`<div class="stat"><span class="small muted">${slotLabel(s)}</span><b>${ch.res[s]}</b><div class="toolbar"><button class="btn" onclick="ch.res['${s}']=clamp(ch.res['${s}']-1,0,8);save();k6RenderSheet()">−</button><button class="btn" onclick="ch.res['${s}']=clamp(ch.res['${s}']+1,0,8);save();k6RenderSheet()">+</button></div></div>`).join('')}</div></div><div class="card"><h2>Defences</h2><div class="derived-grid"><div class="derived"><span class="small muted">Evasion</span><b>${d.evasion}</b></div><div class="derived"><span class="small muted">Resistance</span><b>${d.resistance}</b></div><div class="derived"><span class="small muted">Will</span><b>${d.will}</b></div><div class="derived"><span class="small muted">Initiative</span><b>${d.initiative}</b></div><div class="derived"><span class="small muted">Power</span><b>+${d.power}</b></div><div class="derived"><span class="small muted">Speed</span><b>${d.speed}</b></div></div><h2 class="section">Stats</h2><div class="statgrid">${STATS.map(s=>`<div class="statbox"><span class="small muted">${s}</span><b>${c.stats[s]>=0?'+':''}${c.stats[s]}</b></div>`).join('')}</div><h2 class="section">Conditions</h2><div class="tags">${COND.map(x=>`<button class="pill ${ch.conditions.includes(x)?'selected':''}" onclick="chCond('${x}')">${x}</button>`).join('')}</div></div></div><div class="grid g2 section"><div class="card"><div class="between"><h2>Combat Deck</h2><span class="pill">${ch.deck.length}/${k6MaxDeck(ch.level)}</span></div><p class="small muted">Hand 7 · ${ch.deck.length} cards · ${ch.discard.length} discard · ${ch.draw.length} draw</p><button class="btn primary" onclick="setPage('deck')">Open deck</button></div><div class="card"><h2>Level progression</h2><p class="small muted">Every even level from 2 through 20 unlocks one additional deck slot, reaching 25 at Level 20.</p><button class="btn" onclick="openLevelModal()">Open progression</button></div></div>`}
function chHp(d){state.character.hp=clamp((state.character.hp||0)+d,0,state.character.maxHp||14);save();k6RenderSheet()}
function chCond(x){const a=state.character.conditions,i=a.indexOf(x);i>=0?a.splice(i,1):a.push(x);save();k6RenderSheet()}
function k6EquipmentHtml(){const slots={helmet:'Helmet',body:'Body',hands:'Hands',legs:'Legs',other:'Other',main:'Main Hand',off:'Off Hand'};const ch=state.character;return `<div class="card"><div class="between"><h2>Equipment Loadout</h2><button class="btn primary" onclick="setPage('arsenal')">Browse Arsenal</button></div><div class="equipment-grid section">${Object.entries(slots).map(([k,n])=>{const id=ch.equipmentSlots?.[k],it=ch.equipment.find(x=>(x.id||x.name)===id);return `<div class="equip-slot ${it?'filled':''}"><span class="kicker">${n}</span><h3>${esc(it?.name||'Empty')}</h3>${it?`<p class="small">${k6LinkText(it.description||it.special||'')}</p><button class="btn" onclick="k6Unequip('${k}')">Unequip</button>`:'<span class="small muted">No item equipped.</span>'}</div>`}).join('')}</div><h2 class="section">Inventory</h2><div class="list">${ch.equipment.map((x,i)=>{const it=typeof x==='object'?x:normaliseWeapon(x,i);return `<div class="equip-card"><div class="between"><b>${esc(it.name)}</b><span class="pill">${esc(it.slot||'other')}</span></div><p class="small">${k6LinkText(it.description||it.special||'')}</p><div class="toolbar"><button class="btn primary" onclick="k6Equip(${i})">Equip</button><button class="btn danger" onclick="chRemoveEquipment(${i})">Remove</button></div></div>`}).join('')||'<div class="empty">Your inventory is empty.</div>'}</div></div>`}
function k6TechniquesHtml(){const ch=state.character;return `<div class="grid g2"><div class="card"><div class="between"><h2>Techniques</h2><button class="btn primary" onclick="setPage('arsenal')">Browse</button></div><div class="list section">${(ch.techniques||[]).map((t,i)=>{const x=typeof t==='object'?t:{name:t,effect:'Technique record'};return `<div class="equip-card"><div class="between"><b>${esc(x.name)}</b><button class="btn" onclick="ch.techniques.splice(${i},1);save();k6RenderSheet()">Remove</button></div><p class="small">${k6LinkText(x.effect||x.description||'')}</p><p class="small muted">${k6LinkText(x.choice||'')}</p></div>`}).join('')||'<div class="empty">No techniques equipped.</div>'}</div></div><div class="card"><h2>Technique role</h2><p class="small muted">Techniques supplement your evolving card deck and elemental mastery. The deck remains the primary tactical resource during encounters.</p></div></div>`}
function k6ElementsHtml(){const c=state.creator,ch=state.character;return `<div class="card"><div class="kicker">Element mastery</div><h1 class="title">Body · Mind · Soul</h1><p class="subtitle">The same element changes radically depending on the slot chosen at age thirteen.</p><div class="element-ability-grid section">${Object.entries(c.slots).map(([slot,code])=>{const e=elem(code);return `<div class="card"><span class="kicker">${slotLabel(slot)} · ${K6_SLOT_SYMBOL[slot]}</span><h2>${esc(e[1])}</h2><div class="small muted">${esc(e[2])} · ${esc(e[3])} · ${esc(e[4])}</div>${[1,2,3].map(st=>{const a=k6ElementAbility(code,st,slot);return `<div class="mastery-card section ${ch.level>=a.level?'':'locked'}"><div class="between"><b>${esc(a.title)}</b><span class="pill">Lv ${a.level} · ${a.cost} Reservoir</span></div><p class="small">${k6LinkText(a.effect)}</p><p class="small muted">${esc(a.twist||'')}</p></div>`}).join('')}</div>`}).join('')}</div></div>`}
function k6Progression(){const ch=state.character,levels=Array.from({length:20},(_,i)=>i+1);return levels.map(l=>{const deck=k6MaxDeck(l),slot=l>=2&&l%2===0?'+1 deck slot':'';return `<div class="levelrow ${ch.level===l?'current':''} ${ch.level<l?'locked':''}"><b>Lv ${l}</b><span>${l===1?'Start with 15-card deck and 7-card hand':slot||'Character progression'}</span><span class="pill">${deck} deck slots</span></div>`}).join('')}
function openLevelModal(){document.getElementById('modalbox').innerHTML=`<div class="between"><div><div class="kicker">Progression</div><h2>Level 1–20</h2></div><button class="btn" onclick="closeModal()">×</button></div><p class="small muted">Combat deck slots rise from 15 at Level 1 to 25 at Level 20. New slots unlock at every even level.</p><div class="timeline section">${k6Progression()}</div><div class="toolbar section"><label class="small muted">GM testing level</label><input style="max-width:90px" type="number" min="1" max="20" value="${state.character.level}" onchange="k6SetLevel(this.value)"></div>`;document.getElementById('modal').classList.add('open')}
function k6SetLevel(v){const n=clamp(+v||1,1,20);const old=state.character.level;state.character.level=n;k6NormaliseCharacter();if(n>old)k6LevelSync();save();closeModal();k6Render();toast(`Character set to Level ${n}.`)}
function k6FinishCreation(){if(!state.creator.name||!state.creator.origin||!state.creator.calling||!state.creator.archetype||!state.creator.specialisation||!state.creator.slots.body||!state.creator.slots.mind||!state.creator.slots.soul)return toast('Complete all required creation choices first.');state.character.level=1;state.character.maxHp=14+(state.creator.stats.Might||0)*2;state.character.hp=state.character.maxHp;state.character.res={body:5,mind:5,soul:5};state.character.hope=2;state.character.overload=0;state.character.deck=[];state.character.deckSlots=15;state.character.hand=[];state.character.draw=[];state.character.discard=[];state.character.techniques=[];state.character.equipment=[];state.character.equipmentSlots={helmet:null,body:null,hands:null,legs:null,other:null,main:null,off:null};state.character.createdAt=Date.now();k6SaveCharacter();setPage('character');toast('Level 1 KYMERA character created with a 15-card deck.');}
function k6SaveCharacter(){const v=JSON.parse(localStorage.getItem('kymera-k6-vault')||'{"characters":[],"campaigns":[]}');const id=state.character.id||`char-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;const rec={id,name:state.creator.name,level:state.character.level,updated:Date.now(),data:{creator:JSON.parse(JSON.stringify(state.creator)),character:JSON.parse(JSON.stringify(state.character))}};const ix=v.characters.findIndex(x=>x.id===id);if(ix>=0)v.characters[ix]=rec;else{if(v.characters.length>=25)return toast('Character limit reached: 25.');v.characters.push(rec)}state.character.id=id;localStorage.setItem('kymera-k6-vault',JSON.stringify(v));save()}
function k6Vault(){return JSON.parse(localStorage.getItem('kymera-k6-vault')||'{"characters":[],"campaigns":[]}')}
function k6SaveVault(v){localStorage.setItem('kymera-k6-vault',JSON.stringify(v))}
function k6LoadChar(id){const r=k6Vault().characters.find(x=>x.id===id);if(!r)return;state.creator=r.data.creator;state.character=r.data.character;k6NormaliseCharacter();save();setPage('character')}
function k6DeleteChar(id){const v=k6Vault();v.characters=v.characters.filter(x=>x.id!==id);k6SaveVault(v);k6RenderCharacters()}
function k6NewChar(){if(k6Vault().characters.length>=25)return toast('You have reached the 25-character limit.');state=defaultState();state.page='character';save();k6Render()}
function k6RenderCharacters(){const v=k6Vault();document.getElementById('characters').innerHTML=`<div class="between"><div><div class="kicker">Character vault</div><h1 class="title">Characters</h1><p class="subtitle">Up to 25 characters are stored locally. Each character retains its own deck, equipment, techniques, campaign state and progression.</p></div><button class="btn primary" onclick="k6NewChar()">+ New character</button></div><div class="character-grid section">${v.characters.map((r,i)=>`<div class="card"><div class="between"><span class="pill">${i+1}/25</span><span class="pill">Level ${r.level}</span></div><h2 class="section">${esc(r.name)}</h2><p class="small muted">${esc(r.data.creator.archetype||'—')} · ${esc(r.data.creator.specialisation||'—')}</p><div class="tags">${Object.entries(r.data.creator.slots||{}).map(([s,e])=>`<span class="pill">${slotLabel(s)}: ${e?esc(elem(e)[1]):'—'}</span>`).join('')}</div><div class="toolbar section"><button class="btn primary" onclick="k6LoadChar('${r.id}')">Open</button><button class="btn danger" onclick="k6DeleteChar('${r.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No saved characters.</div>'}</div>`}

const K6_CAMPAIGN={name:'The Resonance Below',acts:[['Act I · Sparks','Missions 01–05','The rebellion begins with a relay and the first choice of route.'],['Act II · Fault Lines','Missions 06–10','Factions, royal pressure and the descent toward the buried vault.'],['Act III · Names in the Dark','Missions 11–14','The rebellion becomes a movement and reaches the source beneath the throne.'],['Act IV · Crownfall','Mission 15','The final assault determines who controls the future.']],flags:{}};
function k6CampaignState(){const c=state.campaign;c.k6=c.k6||{current:'01',completed:[],flags:{},available:['01'],eventLog:[],loot:[],rewards:[],ending:null};return c.k6}
function k6RenderCampaign(){const c=k6CampaignState(),done=new Set(c.completed);document.getElementById('campaign').innerHTML=`<div class="between"><div><div class="kicker">Fixed campaign · branching mission path</div><h1 class="title">${K6_CAMPAIGN.name}</h1><p class="subtitle">The campaign is fixed. The route is not. Mission choices, faction decisions and post-combat events change which missions, loot, rewards and endings you see.</p></div><button class="btn primary" onclick="k6SaveCampaign()">Save Campaign</button></div><div class="grid g2 section"><div class="card"><h2>Campaign map</h2><div class="timeline">${K6_MISSIONS.map(m=>`<div class="levelrow ${done.has(m[0])?'current':''} ${!c.available.includes(m[0])&&!done.has(m[0])&&!c.flags[`closed_${m[0]}`]?'locked':''}"><b>${m[0]}</b><span><b>${esc(m[1])}</b><br><span class="small muted">${esc(m[2])}</span></span><span class="pill">${done.has(m[0])?'Complete':c.available.includes(m[0])?'Available':'Locked'}</span></div>`).join('')}</div></div><div class="card"><h2>Campaign flags</h2><div class="tags">${Object.entries(c.flags).map(([k,v])=>`<span class="pill">${esc(k)}: ${esc(String(v))}</span>`).join('')||'<span class="muted small">No flags yet.</span>'}</div><h2 class="section">Loot & rewards</h2><div class="list">${c.loot.map(x=>`<div class="item">${esc(x)}</div>`).join('')||'<div class="empty">No campaign loot recorded.</div>'}</div></div></div><div class="card section"><h2>Resolve mission</h2><div class="grid g3">${K6_MISSIONS.filter(m=>c.available.includes(m[0])&&!done.has(m[0])&&!c.flags[`closed_${m[0]}`]).map(m=>`<div class="item"><b>${m[0]} · ${esc(m[1])}</b><p class="small">${esc(m[2])}</p><button class="btn primary" onclick="k6CompleteMission('${m[0]}')">Complete mission</button></div>`).join('')||'<div class="empty">No mission currently available. Complete the current route first.</div>'}</div></div><div class="card section"><div class="between"><h2>Post-combat event</h2><button class="btn primary" ${c.flags.eventPending?'':'disabled'} onclick="k6RollEvent()">${c.flags.eventPending?'Draw event':'Event resolved'}</button></div><p class="small muted">35 unique events. Draw one after each completed mission; consequences can be temporary or permanent.</p><div class="list section">${c.eventLog.slice().reverse().map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="small">${esc(x.result)}</div></div>`).join('')||'<div class="empty">No events resolved yet.</div>'}</div></div>`}
const K6_BRANCHES={'01':['02A','02B'],'03':['04A','04B'],'05':['06A','06B'],'07':['08A','08B'],'10':['11A','11B']};
function k6CompleteMission(id){const c=k6CampaignState(),m=K6_MISSIONS.find(x=>x[0]===id);if(!m||!c.available.includes(id)||c.completed.includes(id))return toast('That mission is not currently available.');c.completed.push(id);c.current=id;c.flags[`mission_${id}`]=true;c.flags.eventPending=true;c.loot.push(`${m[1]} cache`);const branch=K6_BRANCHES[id];if(branch){document.getElementById('modalbox').innerHTML=`<div class="between"><div><div class="kicker">Fork in the road</div><h2>${esc(m[1])} is complete</h2></div><button class="btn" onclick="closeModal()">×</button></div><p class="small muted">Choose one route. The unchosen mission will be permanently closed for this campaign.</p><div class="grid g2 section">${branch.map(b=>{const x=K6_MISSIONS.find(z=>z[0]===b);return `<button class="choice" onclick="k6ChooseBranch('${id}','${b}')"><b>${b} · ${esc(x[1])}</b><div class="desc">${esc(x[2])}</div><div class="tags"><span class="pill">${esc(x[5])}</span></div></button>`}).join('')}</div>`;document.getElementById('modal').classList.add('open')}else{k6AdvanceLinear(id);k6SaveCampaign();k6RenderCampaign();toast(`Mission ${id} completed. Draw a post-combat event.`)}}
function k6ChooseBranch(from,to){const c=k6CampaignState(),branch=K6_BRANCHES[from]||[];for(const id of branch)if(id!==to)c.flags[`closed_${id}`]=true;c.available=[...new Set([...c.available,to])];c.flags[`route_${from}`]=to;closeModal();k6AdvanceLinear(from);k6SaveCampaign();k6RenderCampaign();toast(`Route chosen: ${to}.`)}
function k6AdvanceLinear(id){const c=k6CampaignState(),linear={'02A':'03','02B':'03','04A':'05','04B':'05','06A':'07','06B':'07','08A':'09','08B':'09','09':'10','11A':'12','11B':'12','12':'13','13':'14','14':'15'};const next=linear[id];if(next&&!c.flags[`closed_${next}`])c.available=[...new Set([...c.available,next])];if(id==='15')c.ending='KYMERA Ascension'}
function k6RollEvent(){const c=k6CampaignState();c.eventBag=c.eventBag||K6_EVENTS.map(x=>x[0]);if(!c.eventBag.length)c.eventBag=K6_EVENTS.map(x=>x[0]);const eid=c.eventBag.splice(Math.floor(Math.random()*c.eventBag.length),1)[0],ev=K6_EVENTS.find(x=>x[0]===eid);let result=ev[4];if(ev[0]==='01')state.character.hope=clamp((state.character.hope||0)+1,0,10);if(ev[0]==='04')state.character.res.body=clamp((state.character.res.body||0)+2,0,8);if(ev[0]==='13'){state.character.hp=state.character.maxHp;state.character.hope=clamp((state.character.hope||0)+1,0,10)}if(ev[0]==='20')c.flags.mentorLesson=true;if(ev[0]==='35')c.flags.finalPreparation=ev[4];c.flags[`event_${ev[0]}`]=true;c.flags.eventPending=false;c.eventLog.push({name:ev[1],result:`${ev[3].toUpperCase()}: ${result}`});save();k6SaveCampaign();k6RenderCampaign();toast(`Post-combat event: ${ev[1]}`)}
function k6SaveCampaign(){const v=k6Vault(),c=state.campaign,id=c.id||`camp-${Date.now()}`,rec={id,name:c.name||K6_CAMPAIGN.name,updated:Date.now(),data:JSON.parse(JSON.stringify(c))},ix=v.campaigns.findIndex(x=>x.id===id);if(ix>=0)v.campaigns[ix]=rec;else v.campaigns.push(rec);c.id=id;k6SaveVault(v);save();toast('Campaign saved.')}
const K6_FIREBASE_CONFIG={apiKey:'',authDomain:'',projectId:'',storageBucket:'',messagingSenderId:'',appId:''};let k6CloudUser=null;let k6CloudReady=false;
function k6FirebaseConfigured(){return !!(K6_FIREBASE_CONFIG.apiKey&&K6_FIREBASE_CONFIG.authDomain&&K6_FIREBASE_CONFIG.projectId&&K6_FIREBASE_CONFIG.appId)}
function k6LoadScript(src){return new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src=src;sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)})}
async function k6InitFirebase(){if(!k6FirebaseConfigured())return false;try{if(!window.firebase){await k6LoadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');await k6LoadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js');await k6LoadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js')}if(!firebase.apps.length)firebase.initializeApp(K6_FIREBASE_CONFIG);k6CloudReady=true;firebase.auth().onAuthStateChanged(u=>{k6CloudUser=u;k6RenderAccount()});return true}catch(e){console.warn(e);return false}}
async function k6SignIn(){if(!k6CloudReady)return toast('Configure Firebase first.');const email=document.getElementById('k6Email').value.trim(),pass=document.getElementById('k6Pass').value;try{await firebase.auth().signInWithEmailAndPassword(email,pass);toast('Signed in.')}catch(e){toast(e.message)}}
async function k6CreateAccount(){if(!k6CloudReady)return toast('Configure Firebase first.');const email=document.getElementById('k6Email').value.trim(),pass=document.getElementById('k6Pass').value;try{await firebase.auth().createUserWithEmailAndPassword(email,pass);toast('Account created.')}catch(e){toast(e.message)}}
async function k6Google(){if(!k6CloudReady)return toast('Configure Firebase first.');try{await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){toast(e.message)}}
async function k6SignOut(){if(k6CloudReady)await firebase.auth().signOut()}
async function k6CloudSync(){if(!k6CloudUser||!k6CloudReady)return toast('Sign in first.');try{await firebase.firestore().collection('users').doc(k6CloudUser.uid).set({updated:Date.now(),vault:k6Vault()});toast('Characters and campaigns synced.')}catch(e){toast(e.message)}}
function k6RenderAccount(){const a=document.getElementById('account');a.innerHTML=`<div class="kicker">Account & vault</div><h1 class="title">KYMERA Account</h1><div class="grid g2 section"><div class="card"><h2>Local vault</h2><p class="small muted">Works offline. Characters and campaigns are stored in this browser.</p><p><b>${k6Vault().characters.length}/25</b> characters · <b>${k6Vault().campaigns.length}</b> campaigns</p></div><div class="card"><h2>${k6CloudUser?'Signed in':'Sign in / create account'}</h2>${k6CloudUser?`<p>Signed in as <b>${esc(k6CloudUser.email||'Google account')}</b>.</p><div class="toolbar"><button class="btn primary" onclick="k6CloudSync()">Sync vault</button><button class="btn" onclick="k6SignOut()">Sign out</button></div>`:`<div class="field"><label>Email</label><input id="k6Email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="k6Pass" type="password" placeholder="At least 6 characters"></div><div class="toolbar"><button class="btn primary" onclick="k6SignIn()">Sign in</button><button class="btn" onclick="k6CreateAccount()">Create account</button><button class="btn" onclick="k6Google()">Google</button></div>`}</div></div><div class="card section"><h2>Firebase setup</h2><p class="small muted">To enable real email/Google accounts on GitHub Pages, place your own Firebase web-app values in K6_FIREBASE_CONFIG and enable Email/Password + Google Authentication and Firestore.</p><div class="detailbox"><code>K6_FIREBASE_CONFIG = { apiKey:'', authDomain:'', projectId:'', storageBucket:'', messagingSenderId:'', appId:'' }</code></div><button class="btn section" onclick="k6InitFirebase().then(ok=>toast(ok?'Firebase ready.':'Firebase not configured.'))">Initialise cloud account</button></div>`}
function k6RenderGM(){document.getElementById('gm').innerHTML=`<div class="kicker">GM toolkit</div><h1 class="title">GM Forge</h1><div class="grid g2 section"><div class="card"><h2>Enemy recipe</h2><p>Role · Vitality · Evasion · Resistance · Will · Tags · Signature · Reaction · Escalation.</p><button class="btn primary" onclick="k6QuickEnemy()">Generate enemy</button><div id="k6enemy" class="section"></div></div><div class="card"><h2>Encounter recipe</h2><p>Objective · Terrain · Pressure · Elemental complication · Battlefield change.</p><button class="btn primary" onclick="k6QuickEncounter()">Generate encounter</button><div id="k6enc" class="section"></div></div></div>`}
function k6QuickEnemy(){const roles=['Brute','Soldier','Striker','Controller','Skirmisher','Artillery','Support','Elite','Boss'];const r=choice(roles),e=choice(E);document.getElementById('k6enemy').innerHTML=`<div class="detailbox"><b>${r}</b> · ${esc(e[1])} resonance<br>Vitality ${8+E.findIndex(x=>x[0]===e[0])%15} · Evasion 11 · Resistance 12 · Will 10<br>Tags: ${['Push','Marked','Shielded','Exposed'][E.findIndex(x=>x[0]===e[0])%4]} · Signature: ${esc(e[4])} surge<br>Reaction: retaliate after a miss. Escalation: battlefield hazard.</div>`}
function k6QuickEncounter(){const e=choice(E),o=choice(['Hold the objective','Escort an ally','Break the barrier','Survive the escalation']),t=choice(['cover','high ground','hazard','unstable zone']);document.getElementById('k6enc').innerHTML=`<div class="detailbox"><b>Objective:</b> ${o}<br><b>Terrain:</b> ${t}<br><b>Pressure:</b> ${esc(e[1])} resonance intensifies each round.<br><b>Battlefield change:</b> after round 2, one zone becomes ${esc(e[4])} empowered.</div>`}
function k6RenderRules(){document.getElementById('rules').innerHTML=`<div class="kicker">Rules</div><h1 class="title">How KYMERA Plays</h1><div class="grid g2 section"><div class="card"><h2>Core resolution</h2><p>d20 + Stat + one Resonance trait. Difficulties: Easy 10 · Standard 13 · Hard 16 · Extreme 19 · Legendary 22.</p><p>Nat 20 = extra effect. Nat 1 = complication or resource loss.</p></div><div class="card"><h2>Combat cards</h2><p>Hand size 7. Start with 15 cards. Add one deck slot at Levels 2, 4, 6, 8, 10, 12, 14, 16, 18 and 20, reaching 25.</p><p>Play two cards per turn. Use one Top and one Bottom. Do not use two halves from the same category. A played card can replace its action with movement.</p></div><div class="card"><h2>Recovery</h2><p>Skip your turn, refill to 7 and choose two: ${['+1 Hope','+2 Reservoir','Heal 2 HP','Clear 1 Overload','Clear negative statuses'].map(x=>`<b>${x}</b>`).join(' · ')}.</p><p>Recovery Play uses one card-play action to draw 2 and restore 1 Reservoir.</p></div><div class="card"><h2>Equipment</h2><p>Persistent slots: Helmet · Body · Hands · Legs · Other · Main Hand · Off Hand.</p></div><div class="card"><h2>Element channels</h2><p>Each combat card shows B, M or S. That symbol determines which attuned elemental slot may power your one elemental ability for the turn.</p></div><div class="card"><h2>Reference</h2><p>${['Push','Pull','Initiative','Recovery Play','Reservoir','Overload','Synthesis','Cover','Line of Sight','Line of Effect'].map(k6Ref).join(' · ')}</p></div></div>`}
function k6RenderDashboard(){const ch=state.character;k6NormaliseCharacter();document.getElementById('dashboard').innerHTML=`<div class="hero"><div class="kicker">KYMERA · rebuilt from v4</div><h1 class="title">Body. Mind. Soul.</h1><p class="subtitle">KYMERA is now centred on a persistent tactical card deck: seven-card hands, 15-card starting decks, level-based deck growth to 25, unique elemental pools, initiative, Top/Bottom actions, recovery and elemental channels.</p><div class="toolbar"><button class="btn primary" onclick="startCreator()">${state.creator.name?'Continue character':'Create character'}</button><button class="btn" onclick="setPage('deck')">Open Combat Deck</button><button class="btn" onclick="setPage('campaign')">Open Campaign</button></div></div><div class="grid g4 section"><div class="stat"><span class="small muted">Elements</span><b>118</b></div><div class="stat"><span class="small muted">Element cards</span><b>${118*12+118*5}</b><div class="small muted">12 unique + 5 universal per element pool</div></div><div class="stat"><span class="small muted">Deck</span><b>${ch.deck.length}/${k6MaxDeck(ch.level)}</b></div><div class="stat"><span class="small muted">Characters</span><b>${k6Vault().characters.length}/25</b></div></div><div class="grid g2 section"><div class="card"><h2>Current character</h2><p class="sheetname">${esc(state.creator.name||'No character yet')}</p><p class="muted">Level ${ch.level} · ${esc(state.creator.archetype||'—')}</p><div class="tags">${Object.entries(state.creator.slots||{}).map(([s,e])=>`<span class="pill">${slotLabel(s)}: ${e?esc(elem(e)[1]):'—'}</span>`).join('')}</div></div><div class="card"><h2>Build philosophy</h2><ul class="small muted"><li>Birth elements remain random with two complete rerolls.</li><li>At thirteen, the player assigns those three elements to Body, Mind and Soul.</li><li>Every element has distinct Body/Mind/Soul mastery stages.</li><li>The deck is the primary tactical decision engine.</li><li>Equipment, techniques, campaign branches and events persist with the character.</li></ul></div></div>`}
function k6RenderCodex(){const q=(state.search.elements||'').toLowerCase();document.getElementById('codex').innerHTML=`<div class="between"><div><div class="kicker">118 resonances</div><h1 class="title">Element Codex</h1><p class="subtitle">Search by element, family, phase or essence. Open any element to inspect its Body, Mind and Soul mastery.</p></div><span class="pill">${E.filter(e=>e.join(' ').toLowerCase().includes(q)).length} matches</span></div><input class="section" placeholder="Search element, family, essence…" value="${esc(q)}" oninput="state.search.elements=this.value;k6RenderCodex()"><div class="grid g4 section">${E.filter(e=>e.join(' ').toLowerCase().includes(q)).map(e=>`<button class="choice" onclick="k6OpenElement('${e[0]}')"><div class="between"><b>${esc(e[1])}</b><span class="pill">${esc(e[0])}</span></div><div class="small muted">${esc(e[2])} · ${esc(e[3])}</div><p class="small">${esc(e[4])}</p><div class="tags"><span class="pill">Lv 1</span><span class="pill">Lv 7</span><span class="pill">Lv 15</span></div></button>`).join('')}</div>`}
function k6OpenElement(code){const e=elem(code);document.getElementById('modalbox').innerHTML=`<div class="between"><div><div class="kicker">Element dossier · ${esc(e[0])}</div><h2>${esc(e[1])}</h2></div><button class="btn" onclick="closeModal()">×</button></div><p class="muted">${esc(e[2])} · ${esc(e[3])} · ${esc(e[4])}</p><div class="grid g3 section">${['body','mind','soul'].map(s=>`<div class="slot ${s}"><span class="kicker">${slotLabel(s)} · ${K6_SLOT_SYMBOL[s]}</span>${[1,2,3].map(st=>{const a=k6ElementAbility(code,st,s);return `<div class="mastery-card section"><div class="between"><b>${esc(a.title)}</b><span class="pill">Lv ${a.level} · ${a.cost}</span></div><p class="small">${k6LinkText(a.effect)}</p><p class="small muted">${esc(a.twist||'')}</p></div>`}).join('')}</div>`).join('')}</div>`;document.getElementById('modal').classList.add('open')}
function k6Render(){k6EnsurePages();k6RenderNav();K6_NAV.forEach(([id])=>{const el=document.getElementById(id);if(el)el.classList.toggle('active',state.page===id)});k6NormaliseCharacter();const map={dashboard:k6RenderDashboard,character:()=>{if(!state.creator.name||!state.creator.slots.body||!state.creator.slots.mind||!state.creator.slots.soul||!state.creator.archetype){renderCreator();return}k6RenderSheet()},characters:k6RenderCharacters,deck:k6RenderDeck,arsenal:k6RenderArsenal,codex:k6RenderCodex,reference:k6RenderReference,combat:k6RenderCombatOverlay,gm:k6RenderGM,campaign:k6RenderCampaign,rules:k6RenderRules,account:k6RenderAccount};(map[state.page]||k6RenderDashboard)()}
window.k6Render=k6Render;window.k6FinishCreation=k6FinishCreation;window.gainXp=k6GainXp;
// Reuse the stable v4 creator UI, but replace its final completion action.
const k6OldRenderCreator=renderCreator;
renderCreator=function(){k6OldRenderCreator();if(state.creator.step===7){const box=document.getElementById('character');const btn=box.querySelector('.builder-nav button.primary');if(btn){btn.textContent='Create Level 1 character';btn.onclick=k6FinishCreation}}};
// Keep the v4 creator's start/back/step navigation intact, but ensure the new deck is created after completion.
// Existing v4 functions remain available; the renderer above owns all post-creation pages.
// Persist a clean v6 snapshot separately so a failed future migration cannot corrupt the v4 base.
function k6GainXp(n){const ch=state.character;let levels=[];ch.xp=(ch.xp||0)+n;while(ch.level<20&&ch.xp>=levelXp(ch.level+1)){ch.level++;levels.push(ch.level);ch.maxHp=(ch.maxHp||14)+2;ch.hp=ch.maxHp}k6NormaliseCharacter();if(levels.length){ch.pendingRewards=[...(ch.pendingRewards||[]),...levels];save();toast(`Level ${levels[levels.length-1]} reached. Review progression.`);openLevelModal()}else{save();k6Render()}}
function k6Bootstrap(){
 try{ if(!state.search.reference)state.search.reference=''; k6EnsurePages(); k6NormaliseCharacter(); }
 catch(e){console.error('KYMERA bootstrap',e)}
 k6Render();
}
// Add the extra styling only after the v4 stylesheet so the visual language remains consistent.
const k6Style=document.createElement('style');k6Style.textContent=`
.ref-link.k6ref{border:0;background:none;color:var(--cyan);padding:0;text-decoration:underline;text-decoration-style:dotted;font-size:inherit}.combat-card-grid{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:12px}.combat-card{position:relative;border:1px solid #43536a;border-radius:16px;background:linear-gradient(180deg,#121c29,#0a1018);overflow:hidden;box-shadow:var(--shadow);min-height:390px}.combat-card.element-card{border-color:#49657e}.combat-card.universal-card{border-color:#55506d}.card-initiative{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:4px;font-size:20px}.initiative-icon{font-size:14px;color:var(--gold)}.card-symbol{position:absolute;right:12px;top:8px;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-weight:950;background:#0a111a}.card-title{padding:46px 13px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.card-half{padding:13px}.top-half{min-height:150px}.bottom-half{min-height:150px}.card-divider{height:2px;background:#2c394a;margin:0 10px}.card-half-label{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:900}.equipment-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px}.equip-slot{min-height:150px;border:1px solid var(--line);border-radius:13px;padding:12px;background:#0c131d}.equip-slot.filled{border-color:#526b86}.equip-card{padding:13px;border:1px solid var(--line);border-radius:13px;background:#0c131d}.detailbox{border:1px solid var(--line);border-radius:12px;background:#0a1119;padding:12px}.character-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.mastery-card{border:1px solid var(--line);border-radius:12px;padding:11px;background:#0b121b}.mastery-card.locked{opacity:.48}.initiative-icon{font-family:serif}.k6ref{cursor:pointer}@media(max-width:1100px){.combat-card-grid{grid-template-columns:repeat(2,minmax(250px,1fr))}.equipment-grid{grid-template-columns:repeat(4,minmax(120px,1fr))}.character-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.combat-card-grid{grid-template-columns:1fr}.equipment-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.character-grid{grid-template-columns:1fr}}
`;document.head.appendChild(k6Style);
// v4's creator uses its own render loop; after this line the clean v6 renderer is authoritative.
k6Bootstrap();

</script>
</body></html>
