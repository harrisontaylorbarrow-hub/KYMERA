<meta name="theme-color" content="#080c13">

<style>

/* =========================================================
   KYMERA V2
   CORE APPLICATION STYLE
   ========================================================= */

:root {
    --bg: #080c13;
    --bg2: #0c121c;
    --panel: #111925;
    --panel2: #151f2e;

    --border: #28364a;
    --border-light: #35465e;

    --text: #edf3f8;
    --muted: #8e9db2;

    --accent: #6ee7d5;
    --accent-dark: #2f9f92;

    --purple: #9d8cff;
    --blue: #6ea8ff;
    --gold: #ffd166;
    --red: #ff7185;
    --green: #6ee7a8;
    --orange: #ff9f5b;

    --radius: 14px;
    --shadow: 0 12px 35px rgba(0,0,0,.35);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(54,85,120,.22),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 20%,
            rgba(103,76,150,.14),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    line-height: 1.45;
}

/* ---------------------------------------------------------
   GENERAL ELEMENTS
   --------------------------------------------------------- */

button,
input,
select,
textarea {
    font: inherit;
}

button {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);

    border-radius: 9px;
    padding: 9px 13px;

    cursor: pointer;

    transition:
        background .15s ease,
        border-color .15s ease,
        transform .1s ease;
}

button:hover {
    border-color: var(--accent);
    background: #1c2a3d;
}

button:active {
    transform: translateY(1px);
}

button.primary {
    background: var(--accent);
    color: #061014;
    border-color: var(--accent);
    font-weight: 800;
}

button.danger {
    color: #ff9aaa;
    border-color: #713044;
}

button.gold {
    color: #171108;
    background: var(--gold);
    border-color: var(--gold);
}

button.small {
    padding: 6px 9px;
    font-size: 12px;
}

input,
select,
textarea {
    width: 100%;

    color: var(--text);
    background: #080e16;

    border: 1px solid var(--border);
    border-radius: 9px;

    padding: 9px 10px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

label {
    display: grid;
    gap: 5px;

    color: var(--muted);
    font-size: 12px;
}

h1,
h2,
h3,
h4 {
    margin-top: 0;
}

h2 {
    font-size: 20px;
}

h3 {
    font-size: 16px;
}

p {
    margin-top: 0;
}

a {
    color: var(--accent);
}

/* ---------------------------------------------------------
   APPLICATION LAYOUT
   --------------------------------------------------------- */

.app {
    min-height: 100vh;

    display: grid;

    grid-template-columns: 245px 1fr;
}

/* ---------------------------------------------------------
   SIDEBAR
   --------------------------------------------------------- */

.sidebar {
    position: sticky;
    top: 0;

    height: 100vh;

    padding: 20px 14px;

    background:
        linear-gradient(
            180deg,
            #0c121b,
            #090d14
        );

    border-right: 1px solid var(--border);

    display: flex;
    flex-direction: column;

    z-index: 10;
}

.logo {
    font-size: 28px;
    font-weight: 950;

    letter-spacing: .12em;

    margin-bottom: 2px;
}

.logo span {
    color: var(--accent);
}

.logo-subtitle {
    color: var(--muted);
    font-size: 11px;

    letter-spacing: .18em;

    margin-bottom: 18px;
}

.nav {
    display: grid;
    gap: 5px;
}

.nav button {
    width: 100%;

    text-align: left;

    background: transparent;
    border-color: transparent;

    display: flex;
    align-items: center;

    gap: 10px;
}

.nav button.active {
    background: #162335;
    border-color: #30445e;
    color: var(--accent);
}

.nav-icon {
    width: 20px;
    text-align: center;
}

.sidebar-footer {
    margin-top: auto;

    color: var(--muted);

    font-size: 10px;

    line-height: 1.5;
}

/* ---------------------------------------------------------
   MAIN CONTENT
   --------------------------------------------------------- */

.main {
    min-width: 0;
    width: 100%;

    padding:
        22px
        max(22px, env(safe-area-inset-right))
        30px
        max(22px, env(safe-area-inset-left));
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 15px;

    margin-bottom: 18px;
}

.page-title {
    margin: 0;

    font-size: 26px;
    font-weight: 850;
}

.page-subtitle {
    margin-top: 3px;

    color: var(--muted);
    font-size: 13px;
}

.top-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

/* ---------------------------------------------------------
   CARDS
   --------------------------------------------------------- */

.card {
    background:
        linear-gradient(
            145deg,
            rgba(18,26,39,.98),
            rgba(12,18,28,.98)
        );

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding: 16px;

    box-shadow: var(--shadow);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;

    margin-bottom: 12px;
}

.card-header h2,
.card-header h3 {
    margin: 0;
}

/* ---------------------------------------------------------
   GRID
   --------------------------------------------------------- */

.grid {
    display: grid;
    gap: 14px;
}

.grid-2 {
    grid-template-columns:
        repeat(2, minmax(0,1fr));
}

.grid-3 {
    grid-template-columns:
        repeat(3, minmax(0,1fr));
}

.grid-4 {
    grid-template-columns:
        repeat(4, minmax(0,1fr));
}

.grid-6 {
    grid-template-columns:
        repeat(6, minmax(0,1fr));
}

/* ---------------------------------------------------------
   STAT CARDS
   --------------------------------------------------------- */

.stat-card {
    min-height: 105px;
}

.stat-label {
    color: var(--muted);

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .1em;
}

.stat-value {
    font-size: 29px;

    font-weight: 900;

    margin-top: 3px;
}

.stat-help {
    color: var(--muted);

    font-size: 11px;

    margin-top: 2px;
}

/* ---------------------------------------------------------
   PILLS / CHIPS
   --------------------------------------------------------- */

.pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.pill {
    display: inline-flex;

    align-items: center;
    gap: 5px;

    padding: 5px 9px;

    border-radius: 999px;

    background: #101722;

    border: 1px solid var(--border);

    font-size: 11px;
}

.pill.accent {
    color: var(--accent);
    border-color: #2d716b;
}

.pill.purple {
    color: var(--purple);
    border-color: #50457e;
}

.pill.gold {
    color: var(--gold);
    border-color: #705e2d;
}

.pill.red {
    color: var(--red);
    border-color: #713044;
}

/* ---------------------------------------------------------
   PROGRESS
   --------------------------------------------------------- */

.progress {
    height: 8px;

    background: #202b3a;

    border-radius: 99px;

    overflow: hidden;
}

.progress > span {
    display: block;

    height: 100%;

    background: var(--accent);

    border-radius: inherit;

    transition: width .2s ease;
}

/* ---------------------------------------------------------
   FORMS
   --------------------------------------------------------- */

.form-grid {
    display: grid;

    gap: 10px;
}

.form-2 {
    grid-template-columns:
        repeat(2,minmax(0,1fr));
}

.form-3 {
    grid-template-columns:
        repeat(3,minmax(0,1fr));
}

/* ---------------------------------------------------------
   ROWS
   --------------------------------------------------------- */

.row {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 12px;

    padding: 9px 0;

    border-bottom: 1px solid #202b3b;
}

.row:last-child {
    border-bottom: 0;
}

.row-main {
    min-width: 0;
}

.row-title {
    font-weight: 700;
}

.row-sub {
    color: var(--muted);
    font-size: 11px;
}

/* ---------------------------------------------------------
   TABS
   --------------------------------------------------------- */

.tabs {
    display: flex;

    gap: 6px;

    overflow-x: auto;

    margin-bottom: 12px;

    padding-bottom: 2px;
}

.tabs button {
    white-space: nowrap;
}

.tabs button.active {
    background: #24334a;

    border-color: var(--accent);

    color: var(--accent);
}

/* ---------------------------------------------------------
   ELEMENT GRID
   --------------------------------------------------------- */

.element-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill,minmax(150px,1fr));

    gap: 7px;
}

.element-card {
    background: #0d141e;

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 9px;

    cursor: pointer;

    transition:
        border-color .15s,
        transform .1s;
}

.element-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
}

.element-number {
    color: var(--muted);

    font-size: 10px;
}

.element-name {
    font-weight: 800;

    margin-top: 2px;
}

.element-symbol {
    color: var(--accent);

    font-size: 12px;

    font-weight: 800;
}

/* ---------------------------------------------------------
   TABLE
   --------------------------------------------------------- */

.table-wrap {
    width: 100%;

    overflow-x: auto;

    border: 1px solid var(--border);

    border-radius: 10px;
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 700px;
}

th,
td {
    padding: 9px;

    border-bottom: 1px solid #202b3a;

    text-align: left;
}

th {
    color: var(--muted);

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .05em;
}

/* ---------------------------------------------------------
   DICE
   --------------------------------------------------------- */

.dice-result {
    min-height: 100px;

    display: grid;

    place-items: center;

    text-align: center;

    background: #080d15;

    border: 1px solid var(--border);

    border-radius: 12px;
}

.dice-number {
    font-size: 46px;

    font-weight: 950;
}

/* ---------------------------------------------------------
   CHARACTER SHEET
   --------------------------------------------------------- */

.character-banner {
    display: grid;

    grid-template-columns: 100px 1fr auto;

    gap: 15px;

    align-items: center;
}

.character-avatar {
    width: 100px;
    height: 100px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            #253c52,
            #161f2d
        );

    border: 1px solid var(--border);

    display: grid;

    place-items: center;

    font-size: 36px;
}

.character-name {
    font-size: 25px;

    font-weight: 900;
}

/* ---------------------------------------------------------
   RESOURCE ORBS
   --------------------------------------------------------- */

.resources {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 10px;
}

.resource {
    padding: 13px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: #0d141e;
}

.resource-name {
    color: var(--muted);

    font-size: 11px;

    text-transform: uppercase;
}

.resource-value {
    font-size: 25px;

    font-weight: 900;
}

/* ---------------------------------------------------------
   MODAL
   --------------------------------------------------------- */

.modal {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.78);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 15px;

    z-index: 100;
}

.modal.open {
    display: flex;
}

.modal-box {
    width: min(850px,100%);

    max-height: 90vh;

    overflow-y: auto;
}

/* ---------------------------------------------------------
   TOAST
   --------------------------------------------------------- */

.toast {
    position: fixed;

    right: 16px;
    bottom: 16px;

    background: #172437;

    border: 1px solid var(--accent);

    border-radius: 10px;

    padding: 10px 14px;

    display: none;

    z-index: 200;

    box-shadow: var(--shadow);
}

/* ---------------------------------------------------------
   EMPTY
   --------------------------------------------------------- */

.empty {
    padding: 35px 15px;

    text-align: center;

    color: var(--muted);
}

/* ---------------------------------------------------------
   MOBILE
   --------------------------------------------------------- */

@media(max-width:950px) {

    .app {
        grid-template-columns: 1fr;
    }

    .sidebar {
        position: sticky;

        top: 0;

        width: 100%;

        height: auto;

        padding:
            9px
            max(9px,env(safe-area-inset-right))
            9px
            max(9px,env(safe-area-inset-left));

        border-right: 0;

        border-bottom: 1px solid var(--border);
    }

    .logo {
        font-size: 22px;
    }

    .logo-subtitle {
        display: none;
    }

    .nav {
        display: flex;

        overflow-x: auto;
    }

    .nav button {
        width: auto;

        white-space: nowrap;
    }

    .sidebar-footer {
        display: none;
    }

    .main {
        padding: 13px;
    }

    .grid-4,
    .grid-3,
    .grid-2 {
        grid-template-columns: 1fr;
    }

    .grid-6 {
        grid-template-columns:
            repeat(3,1fr);
    }

    .character-banner {
        grid-template-columns: 70px 1fr;
    }

    .character-avatar {
        width: 70px;
        height: 70px;
    }

    .character-banner > :last-child {
        grid-column: 1/-1;
    }
}

@media(max-width:550px) {

    .topbar {
        flex-direction: column;
    }

    .top-actions {
        width: 100%;
    }

    .top-actions button {
        flex: 1;
    }

    .form-2,
    .form-3 {
        grid-template-columns: 1fr;
    }

    .resources {
        grid-template-columns: 1fr;
    }

    .grid-6 {
        grid-template-columns:
            repeat(2,1fr);
    }
}

</style>

/* ---------------------------------------------------------
   LOCAL STORAGE
   --------------------------------------------------------- */

const STORAGE_KEY = "kymera_v2_save";


function saveGame() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

    toast("KYMERA saved.");

}


function loadGame() {

    const raw =
        localStorage.getItem(STORAGE_KEY);

    if (!raw) return;

    try {

        const loaded = JSON.parse(raw);

        state = {
            ...state,
            ...loaded,

            character: {
                ...defaultCharacter(),
                ...(loaded.character || {})
            }

        };

    } catch (error) {

        console.error(error);

        toast("Save could not be loaded.");

    }

}


/* ---------------------------------------------------------
   EXPORT
   --------------------------------------------------------- */

function exportGame() {

    const blob =
        new Blob(
            [JSON.stringify(state,null,2)],
            {type:"application/json"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "KYMERA-save.json";

    a.click();

    URL.revokeObjectURL(url);

}


function importGameFile(file) {

    const reader =
        new FileReader();

    reader.onload = event => {

        try {

            const imported =
                JSON.parse(event.target.result);

            state = {
                ...state,
                ...imported
            };

            saveGame();

            render();

            toast("KYMERA save imported.");

        } catch {

            toast("Invalid save file.");

        }

    };

    reader.readAsText(file);

}

function toast(message) {

    const el =

    el.textContent = message;

    window.__toast =
        setTimeout(() => {

}

/* ---------------------------------------------------------
   DICE ENGINE
   --------------------------------------------------------- */

function d20() {

    return Math.floor(
        Math.random()*20
    ) + 1;

}


function rollD20() {

    const result = d20();

    let outcome;

    if (result === 20) {

        outcome =
            "CRITICAL — extraordinary effect.";

    } else if (result === 1) {

        outcome =
            "COMPLICATION — something goes wrong.";

    } else {

        outcome =
            "Natural result.";

    }

    openModal(
        "D20 Roll",
        `
        <div class="dice-result">

            <div>

                <div class="dice-number">
                    ${result}
                </div>

                <div class="muted">
                    ${outcome}
                </div>

            </div>

        </div>
        `
    );

}


/* ---------------------------------------------------------
   SKILL CHECK
   --------------------------------------------------------- */

function skillCheck(stat, difficulty = 13) {

    const roll = d20();

    const modifier =
        state.character.stats[stat] || 0;

    const total =
        roll + modifier;

    const success =
        total >= difficulty;

    return {

        roll,
        modifier,
        total,
        success

    };

}


/* ---------------------------------------------------------
   CHARACTER STAT HELPERS
   --------------------------------------------------------- */

function statModifier(stat) {

    return state.character.stats[stat] || 0;

}


function changeResource(type,amount) {

    const r =
        state.character.reservoirs;

    const max =
        state.character.maxReservoirs;

    r[type] =
        Math.max(
            0,
            Math.min(
                max[type],
                r[type] + amount
            )
        );

    saveGame();

    render();

}


function changeHope(amount) {

    state.character.hope =
        Math.max(
            0,
            Math.min(
                state.character.maxHope,
                state.character.hope + amount
            )
        );

    saveGame();

    render();

}


function changeOverload(amount) {

    state.character.overload =
        Math.max(
            0,
            state.character.overload + amount
        );

    if (state.character.overload >= 5) {

        state.character.overload = 2;

        toast(
            "BREAK! The GM gains a lasting consequence."
        );

    }

    saveGame();

    render();

}


/* ---------------------------------------------------------
   LEVEL SYSTEM
   --------------------------------------------------------- */

function xpForLevel(level) {

    return level * 1000;

}


function gainXP(amount) {

    const c =
        state.character;

    c.xp += amount;

    let levelled = false;

    while (
        c.level < 20 &&
        c.xp >= xpForLevel(c.level)
    ) {

        c.xp -= xpForLevel(c.level);

        levelUp();

        levelled = true;

    }

    saveGame();

    render();

    if (levelled) {

        toast(
            `Level ${c.level} reached!`
        );

    }

}


function levelUp() {

    const c =
        state.character;

    c.level++;

    c.maxHP += 2;

    c.hp = c.maxHP;

    c.maxReservoirs.Body++;
    c.maxReservoirs.Mind++;
    c.maxReservoirs.Soul++;

    c.reservoirs.Body =
        c.maxReservoirs.Body;

    c.reservoirs.Mind =
        c.maxReservoirs.Mind;

    c.reservoirs.Soul =
        c.maxReservoirs.Soul;

    if (
        [4,8,12,16].includes(c.level)
    ) {

        toast(
            "Ability improvement available."
        );

    }

}

const WEAPON_SEEDS = [

    ["Ironjaw","Melee","Crush","Heavy"],
    ["Glassfang","Melee","Slash","Precise"],
    ["Storm Pike","Melee","Electric","Reach"],
    ["Emberblade","Melee","Heat","Burn"],
    ["Frostbrand","Melee","Cold","Slow"],
    ["Grav Hammer","Melee","Crush","Force"],
    ["Rift Spear","Melee","Spatial","Reach"],
    ["Pulse Gauntlet","Melee","Electric","Combo"],
    ["Blacksteel Axe","Melee","Slash","Brutal"],
    ["Titan Maul","Melee","Crush","Stagger"],

    ["Needle Rifle","Ranged","Pierce","Precise"],
    ["Sunshot","Ranged","Heat","Burn"],
    ["Frostcaster","Ranged","Cold","Slow"],
    ["Arc Carbine","Ranged","Electric","Chain"],
    ["Void Bow","Ranged","Spatial","Phase"],
    ["Shardcaster","Ranged","Pierce","Scatter"],
    ["Resonance Pistol","Ranged","Psychic","Focus"],
    ["Grav Launcher","Ranged","Crush","Push"],
    ["Chemical Sprayer","Ranged","Chemical","Zone"],
    ["Radiant Rifle","Ranged","Radiation","Mark"],

    ["Aegis Plate","Defensive","—","Shield"],
    ["Reactive Mantle","Defensive","—","Reaction"],
    ["Phase Cloak","Defensive","Spatial","Evasion"],
    ["Storm Buckler","Defensive","Electric","Counter"],
    ["Thermal Shell","Defensive","Heat","Resistance"],

    ["Resonance Lens","Utility","Psychic","Scan"],
    ["Void Compass","Utility","Spatial","Navigate"],
    ["Memory Coil","Utility","Psychic","Recall"],
    ["Life Seed","Utility","Life","Restore"],
    ["Temporal Anchor","Utility","Temporal","Anchor"]

];


function generateWeapons() {

    const weapons = [];

    WEAPON_SEEDS.forEach(
        (seed,index) => {

            weapons.push({

                id:
                    `W-${index+1}`,

                name:
                    seed[0],

                category:
                    seed[1],

                damageType:
                    seed[2],

                tag:
                    seed[3],

                damage:
                    index % 5 + 2,

                range:
                    seed[1] === "Ranged"
                    ? 6 + (index%4)
                    : 1,

                weight:
                    seed[1] === "Defensive"
                    ? 2
                    : 1,

                interaction:
                    "Can interact with compatible elemental tags.",

                special:
                    weaponSpecial(seed[3])

            });

        }
    );

    return weapons;

}


function weaponSpecial(tag) {

    const specials = {

        Heavy:
            "If you moved 0 spaces this turn, deal +1 damage.",

        Precise:
            "Ignore 1 point of cover.",

        Reach:
            "May attack one additional space away.",

        Burn:
            "On a critical hit, apply Burning.",

        Slow:
            "On a critical hit, apply Slowed.",

        Force:
            "Push the target 1 space on a hit.",

        Phase:
            "May pass through one obstacle during movement.",

        Combo:
            "If this is your second attack this turn, gain +1.",

        Brutal:
            "On a critical hit, add +2 damage.",

        Stagger:
            "On a critical hit, apply Stunned.",

        Chain:
            "A second target within 2 spaces takes 1 damage.",

        Scatter:
            "May attack a second adjacent target for -2.",

        Focus:
            "Gain +1 on the next Resonance roll.",

        Push:
            "Push the target 2 spaces.",

        Zone:
            "Create a hazardous 1-space zone until your next turn.",

        Mark:
            "Mark the target until the end of your next turn.",

        Shield:
            "Reaction: reduce incoming damage by 2.",

        Reaction:
            "Gain +1 Resistance until your next turn.",

        Evasion:
            "Reaction: gain +2 Evasion against one attack.",

        Counter:
            "When hit by Electric damage, deal 1 back.",

        Resistance:
            "Reduce Heat damage by 1.",

        Scan:
            "Reveal one hidden creature or hazard.",

        Navigate:
            "Always know the direction of a chosen location.",

        Recall:
            "Once per scene, remember a relevant detail.",

        Restore:
            "Restore 2 HP once per rest.",

        Anchor:
            "You cannot be forcibly moved while anchored."

    };

    return specials[tag] ||
        "No additional special rule.";

}

function confirmAddCombatant() {

    const name =
        document.getElementById("combatName").value
        || "Combatant";

    const initiative =
        Number(
            document.getElementById("combatInit").value
        );

    const hp =
        Number(
            document.getElementById("combatHP").value
        );

    const enemy =
        document.getElementById("combatType").value
        === "true";

    state.combat.combatants.push({

        name,
        initiative,
        hp,
        maxHP: hp,
        enemy,
        defeated: false

    });

    state.combat.combatants.sort(
        (a,b) =>
            (b.initiative || 0)
            -
            (a.initiative || 0)
    );

    closeModal();

    saveGame();

    render();

}


function removeCombatant(index) {

    state.combat.combatants
        .splice(index,1);

    if (
        state.combat.active >=
        state.combat.combatants.length
    ) {

        state.combat.active = 0;

    }

    saveGame();

    render();

}


function activateCombatant(index) {

    state.combat.active =
        index;

    const combatant =
        state.combat.combatants[index];

    state.combat.log.push(
        `Round ${state.combat.round}: ${combatant.name}'s turn.`
    );

    saveGame();

    render();

}


function nextRound() {

    state.combat.round++;

    state.combat.active = 0;

    state.combat.log.push(
        `Round ${state.combat.round} begins.`
    );

    saveGame();

    render();

}


function rollInitiative() {

    state.combat.combatants
        .forEach(combatant => {

            combatant.initiative =
                d20();

        });

    state.combat.combatants.sort(
        (a,b) =>
            b.initiative -
            a.initiative
    );

    state.combat.active = 0;

    state.combat.log.push(
        "Initiative rolled."
    );

    saveGame();

    render();

}

function setTile(index) {

/* =========================================================

   ========================================================= */

function renderCampaign() {

    const campaign =
        state.campaign;

    return `

    <div class="card">

        <div class="card-header">

            <h2>
                Campaign
            </h2>

            <button
                class="primary"
                onclick="addCampaignItem('quests')"

                New Quest
            </button>

        </div>

        <label>
            Campaign Name

            <input
                value="${escapeAttribute(campaign.name)}"
                onchange="state.campaign.name=this.value;saveGame()"
            >

        </label>

    </div>


    <div style="height:14px"></div>


    <div class="grid grid-4">

        ${campaignKPI("Locations",campaign.locations.length)}
        ${campaignKPI("Factions",campaign.factions.length)}
        ${campaignKPI("NPCs",campaign.npcs.length)}
        ${campaignKPI("Quests",campaign.quests.length)}

    </div>


    <div style="height:14px"></div>


    <div class="grid grid-2">

        ${campaignList("locations","Locations")}
        ${campaignList("factions","Factions")}
        ${campaignList("npcs","NPCs")}
        ${campaignList("quests","Quests")}

    </div>


    <div style="height:14px"></div>


    <div class="card">

        <h2>
            GM Notes
        </h2>

        <textarea
            onchange="state.campaign.notes=this.value;saveGame()"
        >${escapeHTML(campaign.notes)}</textarea>

    </div>

    `;

}


function campaignKPI(name,value) {

    return `

    <div class="card stat-card">

        <div class="stat-label">
            ${name}
        </div>

        <div class="stat-value">
            ${value}
        </div>

    </div>

    `;

}


function campaignList(key,title) {

    const items =
        state.campaign[key];

    return `

    <div class="card">

        <div class="card-header">

            <h2>
                ${title}
            </h2>

            <button
                class="small"
                onclick="addCampaignItem('${key}')"
            >
                +
            </button>

        </div>

        ${
            items.length
            ?
            items.map(
                (item,index) => `

                <div class="row">

                    <div class="row-main">

                        <div class="row-title">
                            ${escapeHTML(item.name)}
                        </div>

                        <div class="row-sub">
                            ${escapeHTML(item.description || "")}
                        </div>

                    </div>

                    <button
                        class="small danger"
                        onclick="removeCampaignItem('${key}',${index})"
                    >
                        ×
                    </button>

                </div>

                `
            ).join("")
            :
            `<div class="empty">
                Nothing recorded yet.
            </div>`
        }

    </div>

    `;

}


function addCampaignItem(key) {

    const title =
        key.charAt(0).toUpperCase()
        + key.slice(1,-1);

    openModal(

        `New ${title}`,

        `

        <div class="form-grid">

            <label>
                Name

                <input
                    id="campaignItemName"
                    placeholder="${title}"
                >

            </label>

            <label>
                Description

                <textarea
                    id="campaignItemDescription"
                ></textarea>

            </label>

            <button
                class="primary"
                onclick="confirmCampaignItem('${key}')"
            >
                Create
            </button>

        </div>

        `

    );

}


function confirmCampaignItem(key) {

    const name =
        document.getElementById(
            "campaignItemName"
        ).value
        || "Unnamed";

    const description =
        document.getElementById(
            "campaignItemDescription"
        ).value;

    state.campaign[key].push({

        name,
        description

    });

    closeModal();

    saveGame();

    render();

}


function removeCampaignItem(key,index) {

    state.campaign[key]
        .splice(index,1);

    saveGame();

    render();

}

function enemySignature(role) {

            "Fade step — move 2 after attacking.",

            "Long resonance blast — ranged area attack.",

        Support:
            "Stabilising pulse — restore 3 HP to an ally.",

        Swarm:
            "Converge — gains +1 attack for each adjacent ally.",

        Elite:
            "Overdrive — gains an additional action below half HP.",

        Boss:

            "Reposition adjacent to another swarm unit.",

        Elite:
            "Counterattack once per round.",

            "Trigger escalation."

    };

    return reactions[role];

}


function addEnemyToCombat(name,hp) {

    state.combat.combatants.push({

        name,
        hp,
        maxHP: hp,
        initiative: d20(),
        enemy: true,
        defeated: false

    });

    state.combat.combatants.sort(
        (a,b) =>
            b.initiative -
            a.initiative
    );

    closeModal();

    state.currentPage =
        "combat";

    saveGame();

    render();

}

/* =========================================================
   UTILITY FUNCTIONS
   ========================================================= */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];

}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value) {

    return escapeHTML(value);

}
