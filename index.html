const ROLES=['Brute','Soldier','Striker','Controller','Skirmisher','Artillery','Support','Swarm','Elite','Boss'];
const NAV=[['dashboard','Home'],['character','Character'],['arsenal','Arsenal'],['codex','Elements'],['combat','Battle'],['gm','GM Forge'],['campaign','Campaign'],['rules','Rules']];
const DIFF={Easy:10,Standard:13,Hard:16,Extreme:19,Legendary:22};
const stageLevel=[1,7,15];
const essenceWords={Reactive:'reaction',Noble:'ward',Alkali:'surge',Metal:'force',Metalloid:'precision',Nonmetal:'adaptation',Halogen:'corrosion',Lanthanide:'resonance',Actinide:'radiance'};
const stageVerbs=['Awaken','Master','Transcend'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function choice(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function elem(code){return E.find(x=>x[0]===code)}
function levelXp(l){return l>=20?999999:(l-1)*100}
function traitFor(e){return essenceWords[e[3]]||e[4].toLowerCase()}
function slotLabel(s){return s==='body'?'Body':'mind'===s?'Mind':'Soul'}
function slotStat(s){return s==='body'?'Might':s==='mind'?'Intellect':'Resonance'}
function elementAbility(code,stage,slot){
 const e=elem(code), name=e[1], family=e[3], essence=e[4], s=slotLabel(slot), stat=slotStat(slot);
 const cost=stage, lv=stageLevel[stage-1];
 let title, effect;
 if(stage===1){title=`${name} ${stageVerbs[0]}`;effect=`Spend ${cost} ${s} Reservoir: manifest ${essence.toLowerCase()} resonance through your ${s.toLowerCase()} attunement. Make a ${stat} roll; on a success create a brief ${essence.toLowerCase()}-themed advantage, defence or attack. On a success by 5+, also gain +1 on your next related roll.`}
 if(stage===2){title=`${name} ${stageVerbs[1]}`;effect=`Spend ${cost} ${s} Reservoir: intensify your ${essence.toLowerCase()} resonance. Affect one additional target or extend the effect to a nearby zone. You may apply one matching condition from the technique's tags on a strong success.`}
 if(stage===3){title=`${name} ${stageVerbs[2]}`;effect=`Spend ${cost} ${s} Reservoir: enter ${name} Ascendance for one scene. Your ${s.toLowerCase()} attunement gains a signature effect based on ${family.toLowerCase()} resonance; once during the scene, turn a failed related roll into a success with a complication.`}
 const twist=slot==='body'?`Body twist: physicalise ${essence.toLowerCase()} as force, movement or protection.`:slot==='mind'?`Mind twist: interpret ${essence.toLowerCase()} as perception, control or calculation.`:`Soul twist: express ${essence.toLowerCase()} as identity, life-force, space or fate.`;
 return {stage,level:lv,cost,title,effect,twist,tag:essence};
}
function allElementAbilities(code){return ['body','mind','soul'].flatMap(s=>[1,2,3].map(st=>elementAbility(code,st,s)))}
function randomBirthSet(){return shuffle(E).slice(0,3).map(x=>x[0])}
function defaultState(){return {page:'dashboard',creator:{step:1,name:'',pronouns:'',age:13,description:'',origin:'',calling:'',stats:Object.fromEntries(STATS.map(s=>[s,0])),elements:randomBirthSet(),rerolls:2,slots:{body:null,mind:null,soul:null},archetype:'',specialisation:'',goals:'',bonds:'',flaws:''},character:{level:1,xp:0,hp:12,maxHp:12,hope:2,overload:0,res:{body:5,mind:5,soul:5},conditions:[],techniques:[],equipment:[],activeTab:'sheet'},campaign:{name:'New KYMERA Campaign',session:1,notes:'',locations:[],quests:[]},combat:{round:1,active:0,units:[],tiles:{},paint:'floor',history:[]},search:{weapons:'',techniques:'',elements:'',enemies:''}}}
let state=JSON.parse(localStorage.getItem('kymera-v4')||'null')||defaultState();
// Migration from the earlier prototype: preserve useful campaign/character fields while giving the new creator its own data model.
if(!state.creator) state=Object.assign(defaultState(),state);
if(!state.character) state.character=defaultState().character;
if(!state.combat) state.combat=defaultState().combat;
if(!state.search) state.search=defaultState().search;
function save(){localStorage.setItem('kymera-v4',JSON.stringify(state))}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function setPage(p){state.page=p;save();render()}
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(([id,n])=>`<button class="navbtn ${state.page===id?'active':''}" onclick="setPage('${id}')">${n}</button>`).join('')}
function render(){renderNav();NAV.forEach(([id])=>document.getElementById(id).classList.toggle('active',state.page===id));renderPage()}
function renderPage(){({dashboard:renderDashboard,character:renderCharacter,arsenal:renderArsenal,codex:renderCodex,combat:renderCombat,gm:renderGM,campaign:renderCampaign,rules:renderRules}[state.page])()}
function renderDashboard(){const c=state.creator, slots=c.slots;document.getElementById('dashboard').innerHTML=`<div class="hero"><div class="kicker">KYMERA · character and campaign companion</div><h1 class="title">Body. Mind. Soul.</h1><p class="subtitle">Build a character through a guided, D&D Beyond-style creation flow — but with KYMERA's defining rule: your three elements are <b>randomly born into you</b>. You may reroll your birth set twice, then choose how those elements are attuned to Body, Mind and Soul at thirteen.</p><div class="toolbar"><button class="btn primary" onclick="startCreator()">${c.name?'Continue character':'Create character'}</button><button class="btn" onclick="setPage('character')">Open character sheet</button></div></div><div class="grid g4 section"><div class="stat"><span class="muted small">Elements</span><b>118</b><div class="small muted">All represented in the codex</div></div><div class="stat"><span class="muted small">Birth rerolls</span><b>${c.rerolls}</b><div class="small muted">Remaining in creation</div></div><div class="stat"><span class="muted small">Character level</span><b>${state.character.level}</b><div class="small muted">20-level progression</div></div><div class="stat"><span class="muted small">Attunements</span><b>${Object.values(slots).filter(Boolean).length}/3</b><div class="small muted">Body · Mind · Soul</div></div></div><div class="grid g2 section"><div class="card"><h2>Current character</h2>${c.name?`<div class="sheetname">${esc(c.name)}</div><div class="muted">Level ${state.character.level} ${esc(c.archetype||'Unchosen')} · ${esc(c.origin||'Origin pending')}</div><div class="tags">${Object.entries(slots).map(([s,e])=>`<span class="pill">${slotLabel(s)}: ${e?esc(elem(e)[1]):'—'}</span>`).join('')}</div>`:'<div class="empty">Your character has not been completed yet.</div>'}</div><div class="card"><h2>What changed in v3</h2><ul class="small muted"><li>Seven-step guided character creation.</li><li>Birth elements are random — never directly selected.</li><li>Two full birth-set rerolls, then permanent Body/Mind/Soul attunement.</li><li>Every element has three progressive stages at levels 1, 7 and 15, with Reservoir consumption and slot-specific twists.</li><li>Interactive sheet tracks HP, Hope, Overload, Reservoir, conditions, techniques, equipment and rolls.</li></ul></div></div>`}
function startCreator(){state.page='character';state.creator.step=1;save();render()}
function creatorStep(i){state.creator.step=i;save();renderCharacter()}
function renderCharacter(){if(!state.creator.name||!state.creator.slots.body||!state.creator.slots.mind||!state.creator.slots.soul||!state.creator.archetype){renderCreator();return}renderSheet()}
function renderSteps(){const names=['Concept','Origin','Stats','Birth','Attunement','Archetype','Review'];return `<div class="steps">${names.map((n,i)=>`<button class="step ${state.creator.step===i+1?'active':''} ${state.creator.step>i+1?'done':''}" onclick="creatorStep(${i+1})"><span class="stepnum">${i+1}</span>${n}</button>`).join('')}</div>`}
function creatorNext(){const c=state.creator;if(c.step===1&&!c.name.trim()){toast('Give your character a name first.');return}if(c.step===2&&!c.origin){toast('Choose an origin.');return}if(c.step===3){if(Object.values(c.stats).reduce((a,b)=>a+b,0)!==3){toast('Assign the full +2, +1, +1, 0, 0, -1 spread.');return}}if(c.step===5&&Object.values(c.slots).some(x=>!x)){toast('Attune all three elements to Body, Mind and Soul.');return}if(c.step===6&&!c.archetype){toast('Choose an archetype.');return}c.step=Math.min(7,c.step+1);save();renderCharacter()}
function creatorBack(){state.creator.step=Math.max(1,state.creator.step-1);save();renderCharacter()}
function renderCreator(){const c=state.creator;let body='';if(c.step===1)body=`<div class="kicker">Step 1 of 7 · Concept</div><h1 class="title">Who are you?</h1><p class="subtitle">Start with the person, not the numbers. Everything can be changed until you finish creation.</p><div class="formgrid section"><div class="field"><label>Character name *</label><input value="${esc(c.name)}" oninput="state.creator.name=this.value;save()" placeholder="e.g. Kael Voss"></div><div class="field"><label>Pronouns</label><input value="${esc(c.pronouns)}" oninput="state.creator.pronouns=this.value;save()" placeholder="Optional"></div><div class="field"><label>Age</label><input type="number" min="13" value="${c.age}" oninput="state.creator.age=+this.value;save()"></div></div><div class="field"><label>Description</label><textarea oninput="state.creator.description=this.value;save()" placeholder="Appearance, mannerisms, what people notice first…">${esc(c.description)}</textarea></div><div class="formgrid"><div class="field"><label>Goals</label><textarea oninput="state.creator.goals=this.value;save()">${esc(c.goals)}</textarea></div><div class="field"><label>Bonds</label><textarea oninput="state.creator.bonds=this.value;save()">${esc(c.bonds)}</textarea></div><div class="field"><label>Flaws</label><textarea oninput="state.creator.flaws=this.value;save()">${esc(c.flaws)}</textarea></div></div>`;
else if(c.step===2)body=`<div class="kicker">Step 2 of 7 · Origin</div><h1 class="title">Where did you come from?</h1><p class="subtitle">Your origin describes the culture and circumstances that shaped you. Your calling describes what you chose to become.</p><h2 class="section">Origin</h2><div class="choicegrid">${ORIGINS.map(o=>`<button class="choice ${c.origin===o[0]?'selected':''}" onclick="state.creator.origin='${esc(o[0])}';save();renderCharacter()"><b>${esc(o[0])}</b><div class="desc">${esc(o[1])}</div><div class="tags"><span class="pill">${esc(o[2])}</span></div></button>`).join('')}</div><h2 class="section">Calling</h2><div class="choicegrid">${CALL.map(o=>`<button class="choice ${c.calling===o[0]?'selected':''}" onclick="state.creator.calling='${esc(o[0])}';save();renderCharacter()"><b>${esc(o[0])}</b><div class="desc">${esc(o[1])}</div></button>`).join('')}</div>`;
else if(c.step===3)body=`<div class="kicker">Step 3 of 7 · Stats</div><h1 class="title">Shape your capabilities</h1><p class="subtitle">Distribute exactly <b>+2, +1, +1, 0, 0, -1</b>. This keeps the choices meaningful without creating a spreadsheet puzzle.</p><div class="grid g3 section">${STATS.map(s=>`<div class="stat"><div class="between"><b>${s}</b><span class="pill">${c.stats[s]>=0?'+':''}${c.stats[s]}</span></div><div class="toolbar"><button class="btn" onclick="changeStat('${s}',-1)">−</button><button class="btn" onclick="changeStat('${s}',1)">+</button></div></div>`).join('')}</div><div class="card section"><b>Remaining points:</b> ${3-Object.values(c.stats).reduce((a,b)=>a+b,0)} <span class="muted small">(must be 0 to continue)</span></div>`;
else if(c.step===4){const els=c.elements.map(elem);body=`<div class="kicker">Step 4 of 7 · Birth elements</div><h1 class="title">The elements choose you.</h1><p class="subtitle">At birth, three elemental resonances are randomly present in you. You cannot choose them. You may reroll the <b>entire birth set</b> up to two times during character creation.</p><div class="rollbox section"><div><div class="muted small">Current birth set</div><div class="dice">${els.map(x=>esc(x[0])).join(' · ')}</div><div class="tags">${els.map(x=>`<span class="pill">${esc(x[1])} · ${esc(x[4])}</span>`).join('')}</div></div><button class="btn reroll" ${c.rerolls<=0?'disabled':''} onclick="rerollBirth()">Reroll set (${c.rerolls})</button></div><div class="grid g3 section">${els.map((e,i)=>`<div class="card"><div class="between"><b>${esc(e[1])}</b><span class="pill">${esc(e[0])}</span></div><div class="small muted">${esc(e[2])} · ${esc(e[3])}</div><p class="small">Core resonance: <b>${esc(e[4])}</b></p><p class="small muted">You will decide whether this becomes Body, Mind or Soul in the next stage.</p></div>`).join('')}</div>`}
else if(c.step===5){const assigned=Object.values(c.slots).filter(Boolean);body=`<div class="kicker">Step 5 of 7 · Attunement at thirteen</div><h1 class="title">Choose your three paths.</h1><p class="subtitle">You did not choose which elements were born into you. At thirteen, your coming-of-age rite lets you choose <b>which of those three elements you attune to Body, Mind and Soul</b>. Each slot changes what the same element does.</p><div class="grid g3 section">${['body','mind','soul'].map(s=>`<div class="slot ${s}"><div class="between"><div><span class="kicker">${slotLabel(s)}</span><h2>${c.slots[s]?esc(elem(c.slots[s])[1]):'Unattuned'}</h2></div><span class="pill">${slotStat(s)}</span></div><p class="small muted">${s==='body'?'Physicalise the element as force, movement or protection.':s==='mind'?'Interpret it through perception, control or calculation.':'Express it as identity, life-force, space or fate.'}</p>${c.slots[s]?`<button class="btn" onclick="clearSlot('${s}')">Change</button>`:'<span class="pill">Choose below</span>'}</div>`).join('')}</div><h2 class="section">Your birth set</h2><div class="grid g3">${c.elements.map(code=>{const e=elem(code),used=assigned.includes(code);return `<button class="element-chip ${used?'used':''}" ${used?'disabled':''} onclick="chooseSlotPrompt('${code}')"><span><b>${esc(e[1])}</b><span class="small muted"> · ${esc(e[4])}</span></span><span class="pill">${used?'Attuned':'Assign'}</span></button>`}).join('')}</div><p class="small muted section">Tip: there is no universally best slot. The same element becomes a different playstyle in Body, Mind and Soul.</p>`}
else if(c.step===6)body=`<div class="kicker">Step 6 of 7 · Archetype</div><h1 class="title">How do you fight?</h1><p class="subtitle">Your archetype is the chassis around your elemental attunements. Specialisation adds a narrower tactical identity.</p><div class="choicegrid section">${ARCH.map(a=>`<button class="choice ${c.archetype===a[0]?'selected':''}" onclick="chooseArch('${esc(a[0])}')"><b>${esc(a[0])}</b><div class="desc">${esc(a[1])}</div><p class="small muted">${esc(a[2])}</p></button>`).join('')}</div><h2 class="section">Specialisation</h2><div class="choicegrid">${SPECS.map(s=>`<button class="choice ${c.specialisation===s?'selected':''}" onclick="state.creator.specialisation='${esc(s)}';save();renderCharacter()"><b>${esc(s)}</b><div class="desc">A focused branch of the KYMERA chassis.</div></button>`).join('')}</div>`;
else body=`<div class="kicker">Step 7 of 7 · Review</div><h1 class="title">Ready to awaken.</h1><p class="subtitle">Review your choices. Once you finish, the character sheet becomes your permanent interactive play surface.</p><div class="grid g2 section"><div class="card"><h2>${esc(c.name||'Unnamed')}</h2><p class="muted">${esc(c.origin)} · ${esc(c.calling)}</p><div class="statgrid">${STATS.map(s=>`<div class="statbox"><span class="small muted">${s}</span><b>${c.stats[s]>=0?'+':''}${c.stats[s]}</b></div>`).join('')}</div></div><div class="card"><h2>Attunements</h2><div class="tags">${Object.entries(c.slots).map(([s,code])=>`<span class="pill">${slotLabel(s)} · ${esc(elem(code)[1])}</span>`).join('')}</div><p class="small muted">Three-stage progression: Level 1 → Level 7 → Level 15.</p></div></div><div class="card section"><h2>Finalise character</h2><p class="small muted">This creates your level 1 sheet. Your first-stage abilities are immediately available and their Reservoir costs are shown on the sheet.</p><button class="btn primary" onclick="finishCreation()">Finish & open character sheet</button></div>`;
 document.getElementById('character').innerHTML=`<div class="builder">${renderSteps()}<div class="card builder-pane">${body}<div class="builder-nav"><button class="btn" ${c.step===1?'disabled':''} onclick="creatorBack()">Back</button>${c.step<7?`<button class="btn primary" onclick="creatorNext()">Continue</button>`:''}</div></div></div>`}
function changeStat(s,d){const c=state.creator, vals=Object.values(c.stats);if(d>0){const target=c.stats[s]+1;if(target>2)return;if(vals.reduce((a,b)=>a+b,0)>=3)return}if(d<0&&c.stats[s]<=-1)return;const next=c.stats[s]+d;if(next>2||next<-1)return;c.stats[s]=next;save();renderCharacter()}
function rerollBirth(){if(state.creator.rerolls<=0)return;state.creator.elements=randomBirthSet();state.creator.slots={body:null,mind:null,soul:null};state.creator.rerolls--;save();renderCharacter();toast('A new birth set has been rolled.')}
function chooseSlotPrompt(code){const free=['body','mind','soul'].filter(s=>!state.creator.slots[s]);const s=free[0]||prompt('Put this element in which slot? body, mind or soul');if(s&&['body','mind','soul'].includes(s)){if(Object.values(state.creator.slots).includes(code))return;state.creator.slots[s]=code;save();renderCharacter()}}
function clearSlot(s){state.creator.slots[s]=null;save();renderCharacter()}
function chooseArch(a){state.creator.archetype=a;if(!SPECS.includes(state.creator.specialisation))state.creator.specialisation=SPECS[0];save();renderCharacter()}
function finishCreation(){const c=state.creator;state.character={...state.character,level:1,xp:0,hp:12,maxHp:12,hope:2,overload:0,res:{body:5,mind:5,soul:5},conditions:[],techniques:[],equipment:[],activeTab:'sheet'};state.page='character';save();render();toast('Character awakened.')}
function addReservoir(slot,delta){state.character.res[slot]=clamp(state.character.res[slot]+delta,0,8);save();renderSheet()}
function spendHope(){if(state.character.hope<=0)return toast('No Hope remaining.');state.character.hope--;save();renderSheet();toast('Hope spent.')}
function damage(n){state.character.hp=clamp(state.character.hp-n,0,state.character.maxHp);save();renderSheet()}
function heal(n){state.character.hp=clamp(state.character.hp+n,0,state.character.maxHp);save();renderSheet()}
function setCond(cond){const a=state.character.conditions,i=a.indexOf(cond);if(i>=0)a.splice(i,1);else a.push(cond);save();renderSheet()}
function rollCheck(stat,bonus=0){const d=Math.ceil(Math.random()*20),v=d+(state.creator.stats[stat]||0)+bonus;let outcome=d===20?'Critical success':d===1?'Complication':v>=13?'Success':'Failure';toast(`${stat}: d20 ${d} → ${v} · ${outcome}`);}
function useElementAbility(slot,stage){const code=state.creator.slots[slot],ch=state.character,cost=stage;if(!code)return;if(state.character.level<stageLevel[stage-1])return toast(`Unlocks at level ${stageLevel[stage-1]}.`);if(ch.res[slot]<cost){return toast(`Not enough ${slotLabel(slot)} Reservoir.`)}ch.res[slot]-=cost;if(ch.overload>=4){ch.overload=2;toast('BREAK! Overload consequence triggered; Overload reset to 2.')}else{toast(`${elem(code)[1]} ${stageVerbs[stage-1]} used.`)}save();renderSheet()}
function gainXp(n){state.character.xp+=n;while(state.character.level<20&&state.character.xp>=levelXp(state.character.level+1)){state.character.level++;state.character.maxHp+=2;state.character.hp=state.character.maxHp;toast(`Level ${state.character.level} reached!`)}save();renderSheet()}
function renderSheet(){const c=state.creator,ch=state.character,tab=ch.activeTab||'sheet';const max=ch.maxHp||12;document.getElementById('character').innerHTML=`<div class="between"><div><div class="kicker">Interactive character sheet</div><div class="sheetname">${esc(c.name)}</div><div class="muted">Level ${ch.level} ${esc(c.archetype)} · ${esc(c.specialisation)} · ${esc(c.origin)}</div></div><div class="toolbar"><button class="btn primary" onclick="rollCheck('Resonance')">Roll Resonance</button><button class="btn" onclick="openLevelModal()">Level & progression</button><button class="btn" onclick="startCreator()">Edit creation</button></div></div><div class="sheetnav">${[['sheet','Overview'],['elements','Elements'],['techniques','Techniques'],['equipment','Equipment'],['story','Story']].map(x=>`<button class="btn ${tab===x[0]?'active':''}" onclick="state.character.activeTab='${x[0]}';save();renderSheet()">${x[1]}</button>`).join('')}</div>${tab==='sheet'?sheetOverview():tab==='elements'?sheetElements():tab==='techniques'?sheetTechniques():tab==='equipment'?sheetEquipment():sheetStory()}`}
function sheetOverview(){const c=state.creator,ch=state.character;return `<div class="sheethero section"><div class="card"><div class="between"><h2>Vitals</h2><span class="pill">Level ${ch.level}</span></div><div class="hpgrid"><div class="stat"><div class="between"><span>HP</span><b>${ch.hp}/${ch.maxHp}</b></div><div class="bar"><i style="width:${100*ch.hp/ch.maxHp}%"></i></div><div class="toolbar"><button class="btn" onclick="damage(1)">−1</button><button class="btn" onclick="heal(1)">+1</button><button class="btn" onclick="damage(5)">−5</button><button class="btn" onclick="heal(5)">+5</button></div></div><div class="stat"><div class="between"><span>Hope</span><b>${ch.hope}</b></div><div class="toolbar"><button class="btn" onclick="spendHope()">Spend</button><button class="btn" onclick="state.character.hope++;save();renderSheet()">Gain</button></div></div></div><div class="resourcegrid section">${['body','mind','soul'].map(s=>`<div class="stat"><div class="between"><span>${slotLabel(s)} Reservoir</span><b>${ch.res[s]}</b></div><div class="track">${Array.from({length:5},(_,i)=>`<span class="dot ${i<ch.res[s]?'on':''}"></span>`).join('')}</div><div class="toolbar"><button class="btn" onclick="addReservoir('${s}',-1)">−</button><button class="btn" onclick="addReservoir('${s}',1)">+</button></div></div>`).join('')}</div><div class="stat section"><div class="between"><span>Overload</span><b>${ch.overload}/5</b></div><div class="track">${Array.from({length:5},(_,i)=>`<span class="dot ${i<ch.overload?'on':''}"></span>`).join('')}</div><div class="toolbar"><button class="btn" onclick="state.character.overload=clamp(state.character.overload-1,0,5);save();renderSheet()">−</button><button class="btn" onclick="state.character.overload=clamp(state.character.overload+1,0,5);save();renderSheet()">+</button></div></div></div><div class="card"><h2>Core stats</h2><div class="statgrid">${STATS.map(s=>`<div class="statbox"><span class="small muted">${s}</span><b>${c.stats[s]>=0?'+':''}${c.stats[s]}</b></div>`).join('')}</div><h2 class="section">Conditions</h2><div class="tags">${COND.map(x=>`<button class="pill ${ch.conditions.includes(x)?'selected':''}" onclick="setCond('${x}')">${x}</button>`).join('')}</div></div></div><div class="grid g2 section"><div class="card"><h2>Quick actions</h2><div class="toolbar"><button class="btn primary" onclick="rollCheck('Might')">Might</button><button class="btn primary" onclick="rollCheck('Agility')">Agility</button><button class="btn primary" onclick="rollCheck('Intellect')">Intellect</button><button class="btn primary" onclick="rollCheck('Perception')">Perception</button><button class="btn primary" onclick="rollCheck('Presence')">Presence</button><button class="btn primary" onclick="rollCheck('Resonance')">Resonance</button></div><p class="small muted">Core roll: d20 + Stat + one Resonance trait. Nat 20 adds an extra effect; nat 1 adds a complication.</p></div><div class="card"><h2>Progress</h2><div class="between"><span>XP</span><b>${ch.xp}/${levelXp(ch.level+1)}</b></div><div class="progress"><i style="width:${ch.level>=20?100:100*ch.xp/levelXp(ch.level+1)}%"></i></div><div class="toolbar"><button class="btn" onclick="gainXp(25)">+25 XP</button><button class="btn" onclick="gainXp(100)">+100 XP</button></div></div></div>`}
function sheetElements(){const c=state.creator;return `<div class="card"><div class="kicker">Your attunements</div><h1 class="title">Element paths</h1><p class="subtitle">Every element has the same three progression gates — Level 1, Level 7 and Level 15 — but the element and slot determine the expression.</p><div class="element-ability-grid section">${Object.entries(c.slots).map(([slot,code])=>{const e=elem(code);return `<div class="card"><div class="between"><h2>${esc(e[1])}</h2><span class="pill">${slotLabel(slot)}</span></div><div class="small muted">${esc(e[2])} · ${esc(e[3])} · ${esc(e[4])}</div><div class="section">${[1,2,3].map(st=>{const a=elementAbility(code,st,slot),unlocked=state.character.level>=a.level;return `<div class="ability stage${st} ${unlocked?'':'locked'}"><span class="pill cost">${a.cost} ${slotLabel(slot)}</span><b>${esc(a.title)}</b><div class="small muted">Level ${a.level}</div><p class="small">${esc(a.effect)}</p><p class="small"><b>${esc(a.twist)}</b></p>${unlocked?`<button class="btn" onclick="useElementAbility('${slot}',${st})">Use ability · ${a.cost} Reservoir</button>`:`<span class="pill">Locked until level ${a.level}</span>`}</div>`}).join('<div style="height:7px"></div>')}</div></div>`}).join('')}</div></div>`}
function sheetTechniques(){return `<div class="card"><div class="between"><div><div class="kicker">Ability loadout</div><h1 class="title">Techniques</h1></div><button class="btn primary" onclick="setPage('arsenal')">Browse 100 techniques</button></div><p class="subtitle">Keep your equipped techniques here. The element abilities above are always tied to your attunements.</p><div class="list section">${state.character.techniques.length?state.character.techniques.map((t,i)=>`<div class="item"><div class="between"><b>${esc(t)}</b><button class="btn" onclick="state.character.techniques.splice(${i},1);save();renderSheet()">Remove</button></div></div>`).join(''):'<div class="empty">No extra techniques equipped. Browse the arsenal to learn some.</div>'}</div></div>`}
function sheetEquipment(){return `<div class="card"><div class="between"><div><div class="kicker">Loadout</div><h1 class="title">Equipment</h1></div><button class="btn primary" onclick="setPage('arsenal')">Browse 100 weapons</button></div><div class="list section">${state.character.equipment.length?state.character.equipment.map((t,i)=>`<div class="item"><div class="between"><b>${esc(t)}</b><button class="btn" onclick="state.character.equipment.splice(${i},1);save();renderSheet()">Remove</button></div></div>`).join(''):'<div class="empty">No equipment equipped yet.</div>'}</div></div>`}
function sheetStory(){const c=state.creator;return `<div class="grid g2"><div class="card"><h2>Identity</h2><p><b>Pronouns:</b> ${esc(c.pronouns||'—')}</p><p><b>Age:</b> ${c.age}</p><p><b>Calling:</b> ${esc(c.calling)}</p><p><b>Description:</b> ${esc(c.description||'—')}</p></div><div class="card"><h2>Story anchors</h2><p><b>Goals:</b> ${esc(c.goals||'—')}</p><p><b>Bonds:</b> ${esc(c.bonds||'—')}</p><p><b>Flaws:</b> ${esc(c.flaws||'—')}</p></div></div>`}
function openLevelModal(){document.getElementById('modalbox').innerHTML=`<div class="between"><div><div class="kicker">20-level progression</div><h2>Character advancement</h2></div><button class="btn" onclick="closeModal()">×</button></div><p class="small muted">Element stages are deliberately separate from the general level rewards: every attuned element awakens at 1, masters at 7 and transcends at 15.</p><div class="timeline">${Array.from({length:20},(_,i)=>{let l=i+1,unlock=l===1?'Element Stage I':l===7?'Element Stage II':l===15?'Element Stage III':l===20?'KYMERA Ascension':l%4===0?'Ability / Stat Improvement':l%3===0?'Technique or Mastery':'Class feature / utility';return `<div class="levelrow ${state.character.level===l?'current':''} ${state.character.level<l?'locked':''}"><b>Lv ${l}</b><span>${unlock}</span><span class="pill">${state.character.level>=l?'Unlocked':'Locked'}</span></div>`}).join('')}</div>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
// Content sets: 100 original weapons, techniques and adversaries. These are individually named and mechanically searchable.
const weaponBases=['Resonance Sabre','Grav Hammer','Pulse Spear','Arc Carbine','Phase Bow','Kinetic Maul','Rift Axe','Glass Rapier','Storm Gauntlet','Iron Lash','Ember Pike','Frost Hook','Echo Staff','Void Chakram','Magnet Halberd','Solar Disc','Tide Blade','Quake Club','Gale Knives','Prism Rifle'];
const weapons=Array.from({length:100},(_,i)=>{const b=weaponBases[i%weaponBases.length],n=Math.floor(i/20)+1;const types=['Slash','Crush','Pierce','Electric','Heat','Cold','Psychic','Spatial'];return {id:i+1,name:`${b} ${n}`,category:i<20?'Melee':i<40?'Ranged':i<60?'Elemental':i<75?'Defensive':i<90?'Utility':'Legendary',range:i<40?'5':'2',damage:4+(i%5),type:types[i%types.length],tags:[E[i%118][4],i%2?'Mobile':'Heavy'],special:`Once per scene, interact with ${E[i%118][1]} resonance to gain +1 on a related roll.`,weight:1+(i%4)}});
const techniqueNames=['Resonant Strike','Vector Step','Guarding Pulse','Elemental Feint','Overload Burst','Kinetic Reversal','Soul Anchor','Mind Lance','Body Surge','Prismatic Ward','Rift Step','Echo Mark','Pressure Point','Resonance Net','Phase Guard','Catalytic Leap','Aegis Break','Harmonic Push','Null Veil','Fate Thread'];
const techniques=Array.from({length:100},(_,i)=>({id:i+1,name:`${techniqueNames[i%20]} ${Math.floor(i/20)+1}`,category:['Body','Mind','Soul','Elemental','Synthesis','Reaction','Movement','Defensive','Ultimate'][i%9],cost:1+(i%3),range:['Self','5','10','15'][i%4],effect:`Make a d20 + relevant Stat roll. On success, deal ${3+(i%5)} ${['Physical','Energetic','Mental','Soul'][i%4]} damage or create a tactical effect: push, pull, zone, mark, guard or reposition.`,choice:i%2?'Choose: extra target or +2 effect.':'Choose: move 2 or gain +1 defence.'}));
const enemyN=['Ash Stalker','Resonance Hound','Ironbound Raider','Glass Wraith','Storm Marauder','Null Cultist','Bloom Horror','Phase Leech','Grav Titan','Echo Witch','Crystal Devourer','Rift Scavenger','Sonic Brute','Frost Revenant','Magnet Knight','Radiant Seraph','Toxic Swarm','Clockwork Husk','Void Herald','Elemental Colossus'];
const enemies=Array.from({length:100},(_,i)=>({id:i+1,name:`${enemyN[i%20]} ${Math.floor(i/20)+1}`,role:ROLES[i%ROLES.length],vitality:10+(i%10)*3,evasion:10+(i%6),resistance:11+(i%5),will:10+(i%7),element:E[i%118][1],tags:[E[i%118][4],i%3?'Aggressive':'Tactical'],signature:`${E[i%118][4]} resonance attack that changes position or applies a condition.`,reaction:`When targeted by a strong hit, shift 2 spaces or create a brief ${E[(i+17)%118][4].toLowerCase()} zone.`,escalation:`At half Vitality, gain an additional tactical option and become more dangerous.`}));
const LOOT=['Resonance Mantle','Attunement Lens','Hope Engine','Overload Bracer','Elemental Compass','Phase Boots','KYMERA Sigil','Synthesis Core','Guardian Harness','Echo Crown'];
function renderArsenal(){const q=state.search.weapons;document.getElementById('arsenal').innerHTML=`<div class="kicker">Player loadout</div><h1 class="title">Arsenal</h1><p class="subtitle">100 weapons and 100 techniques. Search, inspect, then equip what fits your character.</p><div class="grid g2 section"><div class="card"><h2>Weapons · 100</h2><input placeholder="Search weapons…" value="${esc(q)}" oninput="state.search.weapons=this.value;renderArsenal()"><div class="list section">${weapons.filter(w=>(w.name+' '+w.category+' '+w.type+' '+w.tags.join(' ')).toLowerCase().includes(q.toLowerCase())).map(w=>`<div class="item"><div class="between"><b>#${w.id} ${esc(w.name)}</b><span class="pill">${w.category}</span></div><div class="small muted">${w.damage} ${w.type} · Range ${w.range} · Weight ${w.weight}</div><div class="tags">${w.tags.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><p class="small">${esc(w.special)}</p><button class="btn" onclick="equipWeapon('${esc(w.name)}')">Equip</button></div>`).join('')}</div></div><div class="card"><h2>Techniques · 100</h2><input placeholder="Search techniques…" value="${esc(state.search.techniques)}" oninput="state.search.techniques=this.value;renderArsenal()"><div class="list section">${techniques.filter(t=>(t.name+' '+t.category+' '+t.effect).toLowerCase().includes(state.search.techniques.toLowerCase())).map(t=>`<div class="item"><div class="between"><b>#${t.id} ${esc(t.name)}</b><span class="pill">${t.category}</span></div><div class="small muted">Cost ${t.cost} · Range ${t.range}</div><p class="small">${esc(t.effect)}</p><p class="small muted">${esc(t.choice)}</p><button class="btn" onclick="learnTechnique('${esc(t.name)}')">Learn</button></div>`).join('')}</div></div></div>`}
function equipWeapon(n){if(!state.character.equipment.includes(n))state.character.equipment.push(n);save();toast('Weapon equipped.');}
function learnTechnique(n){if(!state.character.techniques.includes(n))state.character.techniques.push(n);save();toast('Technique learned.');}
function renderCodex(){const q=state.search.elements;document.getElementById('codex').innerHTML=`<div class="kicker">The 118 resonances</div><h1 class="title">Element Codex</h1><p class="subtitle">Every element is a complete character-building branch. Birth is random; the player only decides the Body/Mind/Soul attunement of the three elements they were given.</p><input value="${esc(q)}" placeholder="Search element, family, state or resonance…" oninput="state.search.elements=this.value;renderCodex()"><div class="grid g4 section">${E.filter(e=>(e.join(' ')).toLowerCase().includes(q.toLowerCase())).map(e=>`<button class="choice" onclick="openElementModal('${e[0]}')"><div class="between"><b>${esc(e[1])}</b><span class="pill">${esc(e[0])}</span></div><div class="small muted">${esc(e[2])} · ${esc(e[3])}</div><p class="small">Resonance: <b>${esc(e[4])}</b></p><div class="tags"><span class="pill">Stage I · Lv 1</span><span class="pill">Stage II · Lv 7</span><span class="pill">Stage III · Lv 15</span></div></button>`).join('')}</div>`}
function openElementModal(code){const e=elem(code);document.getElementById('modalbox').innerHTML=`<div class="between"><div><div class="kicker">Element dossier</div><h2>${esc(e[1])} <span class="pill">${esc(e[0])}</span></h2></div><button class="btn" onclick="closeModal()">×</button></div><p class="muted">${esc(e[2])} · ${esc(e[3])} · ${esc(e[4])}</p><div class="grid g3 section">${['body','mind','soul'].map(s=>`<div class="slot ${s}"><div class="kicker">${slotLabel(s)}</div>${[1,2,3].map(st=>{const a=elementAbility(code,st,s);return `<div class="ability stage${st} section"><span class="pill cost">${a.cost} Reservoir</span><b>${esc(a.title)}</b><div class="small muted">Level ${a.level}</div><p class="small">${esc(a.effect)}</p><p class="small"><b>${esc(a.twist)}</b></p></div>`}).join('')}</div>`).join('')}</div>`;document.getElementById('modal').classList.add('open')}
function renderCombat(){const b=state.combat;const units=b.units;document.getElementById('combat').innerHTML=`<div class="between"><div><div class="kicker">Tactical encounter board</div><h1 class="title">Battle</h1><p class="subtitle">12×7 tactical board with initiative, terrain, objectives and quick unit controls.</p></div><div class="toolbar"><button class="btn" onclick="addUnit('Hero')">+ Hero</button><button class="btn" onclick="addUnit('Enemy')">+ Enemy</button><button class="btn primary" onclick="nextTurn()">Next turn</button></div></div><div class="grid g2 section"><div class="card"><div class="between"><h2>Round ${b.round}</h2><div class="toolbar"><button class="btn" onclick="b.paint='floor';save();renderCombat()">Floor</button><button class="btn" onclick="b.paint='wall';save();renderCombat()">Wall</button><button class="btn" onclick="b.paint='cover';save();renderCombat()">Cover</button><button class="btn" onclick="b.paint='hazard';save();renderCombat()">Hazard</button><button class="btn" onclick="b.paint='objective';save();renderCombat()">Objective</button></div></div><div class="hexmap section">${Array.from({length:84},(_,i)=>{const t=b.tiles[i]||'floor',u=units.find(x=>x.pos===i);return `<button class="tile ${t}" onclick="paintTile(${i})">${u?`<span class="unit">${u.type==='Hero'?'H':'E'}</span>`:''}</button>`}).join('')}</div></div><div class="card"><h2>Initiative</h2><div class="list">${units.length?units.map((u,i)=>`<div class="item initiative ${b.active===i?'turn':''}"><b>${u.init}</b><span><b>${esc(u.name)}</b><div class="small muted">${u.type}</div></span><input type="number" value="${u.hp}" onchange="units[${i}].hp=+this.value;save();renderCombat()"><button class="btn" onclick="removeUnit(${i})">×</button></div>`).join(''):'<div class="empty">Add heroes and enemies to start.</div>'}</div></div></div>`}
function addUnit(type){const u={name:type==='Hero'?`Hero ${state.combat.units.filter(x=>x.type==='Hero').length+1}`:`Enemy ${state.combat.units.filter(x=>x.type==='Enemy').length+1}`,type,init:Math.ceil(Math.random()*20),hp:type==='Hero'?12:20,pos:state.combat.units.length};state.combat.units.push(u);state.combat.units.sort((a,b)=>b.init-a.init);save();renderCombat()}
function removeUnit(i){state.combat.units.splice(i,1);state.combat.active=0;save();renderCombat()}
function nextTurn(){if(!state.combat.units.length)return;state.combat.active++;if(state.combat.active>=state.combat.units.length){state.combat.active=0;state.combat.round++}save();renderCombat()}
function paintTile(i){state.combat.tiles[i]=state.combat.paint;save();renderCombat()}
function renderGM(){const q=state.search.enemies;document.getElementById('gm').innerHTML=`<div class="kicker">Game Master command deck</div><h1 class="title">GM Forge</h1><p class="subtitle">Generate opposition, encounters and loot, then send an encounter to the tactical board.</p><div class="grid g3 section"><div class="card"><h2>100 Adversaries</h2><input placeholder="Search enemies…" value="${esc(q)}" oninput="state.search.enemies=this.value;renderGM()"><div class="list section">${enemies.filter(e=>(e.name+' '+e.role+' '+e.element+' '+e.tags.join(' ')).toLowerCase().includes(q.toLowerCase())).map(e=>`<div class="item"><div class="between"><b>#${e.id} ${esc(e.name)}</b><span class="pill">${e.role}</span></div><div class="small muted">Vitality ${e.vitality} · Evasion ${e.evasion} · Resistance ${e.resistance} · Will ${e.will}</div><div class="tags"><span class="pill">${esc(e.element)}</span>${e.tags.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><p class="small"><b>Signature:</b> ${esc(e.signature)}</p><p class="small"><b>Reaction:</b> ${esc(e.reaction)}</p><p class="small"><b>Escalation:</b> ${esc(e.escalation)}</p></div>`).join('')}</div></div><div class="card"><h2>Encounter Generator</h2><div class="field"><label>Objective</label><select id="obj"><option>Defeat</option><option>Survive</option><option>Protect</option><option>Escape</option><option>Capture</option><option>Retrieve</option><option>Escort</option></select></div><div class="field"><label>Environment</label><select id="env"><option>Ruined city</option><option>Crystal cavern</option><option>Storm coast</option><option>Jungle temple</option><option>Industrial vault</option><option>Frozen wasteland</option></select></div><button class="btn primary" onclick="generateEncounter()">Generate</button><div id="encounterOut" class="section"></div></div><div class="card"><h2>Loot Forge</h2><div class="field"><label>Tier</label><select id="lootTier"><option>Common</option><option>Uncommon</option><option>Rare</option><option>Epic</option><option>Legendary</option><option>Mythic</option></select></div><button class="btn primary" onclick="forgeLoot()">Forge loot</button><div id="lootOut" class="section"></div><h2 class="section">GM recipe</h2><p class="small muted">Use Role + Vitality + three Defences + 2–4 Tags + Signature + Reaction + Escalation. Encounters should have an objective, terrain, pressure, elemental complication and at least one battlefield change.</p></div></div>`}
function generateEncounter(){const obj=document.getElementById('obj').value,env=document.getElementById('env').value,e1=choice(enemies),e2=choice(enemies);document.getElementById('encounterOut').innerHTML=`<div class="item"><b>${obj} · ${env}</b><p class="small">Pressure: ${choice(['rising hazard','reinforcements','collapsing terrain','limited visibility','unstable resonance'])}.</p><p class="small">Elemental complication: ${choice(E)[1]} resonance changes the battlefield every 2 rounds.</p><p class="small">Opposition: ${e1.name}, ${e2.name}, plus environmental hazard.</p><button class="btn" onclick="setPage('combat');addUnit('Enemy');addUnit('Enemy')">Send to Battle</button></div>`}
function forgeLoot(){const tier=document.getElementById('lootTier').value,n=choice(LOOT);document.getElementById('lootOut').innerHTML=`<div class="item"><b>${tier} · ${n}</b><p class="small">Choose one attuned element. Once per scene, spend 1 matching Reservoir to push 2, create a zone, gain +2 Evasion, or clear one minor condition.</p></div>`}
function renderCampaign(){const c=state.campaign;document.getElementById('campaign').innerHTML=`<div class="between"><div><div class="kicker">Campaign manager</div><h1 class="title">${esc(c.name)}</h1><p class="subtitle">Keep your campaign notes, locations and quests in local storage.</p></div><div class="toolbar"><button class="btn primary" onclick="addLocation()">Add location</button><button class="btn" onclick="addQuest()">Add quest</button></div></div><div class="grid g2 section"><div class="card"><h2>Campaign setup</h2><div class="field"><label>Campaign name</label><input value="${esc(c.name)}" onchange="c.name=this.value;save()"></div><div class="field"><label>Current session</label><input type="number" value="${c.session}" onchange="c.session=+this.value;save()"></div><div class="field"><label>GM notes</label><textarea onchange="c.notes=this.value;save()">${esc(c.notes)}</textarea></div><h3>Locations</h3><div class="list">${c.locations.length?c.locations.map((x,i)=>`<div class="item"><div class="between"><b>${esc(x)}</b><button class="btn" onclick="c.locations.splice(${i},1);save();renderCampaign()">×</button></div></div>`).join(''):'<div class="empty">No locations yet.</div>'}</div></div><div class="card"><h2>Quests</h2><div class="list">${c.quests.length?c.quests.map((x,i)=>`<div class="item"><div class="between"><b>${esc(x)}</b><button class="btn" onclick="c.quests.splice(${i},1);save();renderCampaign()">×</button></div><div class="tags"><span class="pill">Active</span></div></div>`).join(''):'<div class="empty">No quests yet.</div>'}</div></div></div>`}
function addLocation(){const x=prompt('Location name');if(x){state.campaign.locations.push(x);save();renderCampaign()}}function addQuest(){const x=prompt('Quest name');if(x){state.campaign.quests.push(x);save();renderCampaign()}}
function renderRules(){document.getElementById('rules').innerHTML=`<div class="kicker">Core rules reference</div><h1 class="title">How KYMERA plays</h1><div class="grid g2 section"><div class="card"><h2>Resolution</h2><p><b>Roll:</b> d20 + Stat + one Resonance trait.</p><p><b>Difficulties:</b> Easy 10 · Standard 13 · Hard 16 · Extreme 19 · Legendary 22.</p><p><b>Advantage:</b> 2d20 keep high. Disadvantage keeps low. Extra edges add +1, max +3.</p><p><b>Nat 20:</b> extra effect. <b>Nat 1:</b> complication or resource loss.</p></div><div class="card"><h2>Turn</h2><p>Move + 2 Actions + 1 Reaction.</p><div class="tags">${['Attack','Power','Guard','Dash','Interact','Prepare','Synthesize'].map(x=>`<span class="pill">${x}</span>`).join('')}</div><p class="small muted">Cover: +2 Evasion. High ground: +1 ranged rolls.</p></div><div class="card"><h2>Reservoir</h2><p>Body, Mind and Soul Reservoir are the fuel for elemental techniques. Element abilities cost 1 / 2 / 3 Reservoir at stages I / II / III.</p><p>Stage I unlocks at <b>Level 1</b>, Stage II at <b>Level 7</b>, Stage III at <b>Level 15</b>.</p><p>Spending beyond safe capacity creates Overload. At 5 Overload, Break: reset to 2 and take a lasting GM consequence.</p></div><div class="card"><h2>Attunement lore</h2><p>Every child is born with three random elements. The player does not choose those elements.</p><p>At thirteen, the coming-of-age rite lets the character decide which of the three goes to <b>Body</b>, <b>Mind</b> and <b>Soul</b>. The same element therefore has three distinct expressions.</p></div><div class="card"><h2>Combat</h2><p>Defences: Evasion, Resistance, Will.</p><p>Damage families: Physical, Energetic, Mental and Soul, with specific types inside each.</p><p>Battlefields should contain cover, hazards, objectives and changing elemental conditions.</p></div><div class="card"><h2>Conditions</h2><div class="tags">${COND.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div><div class="card"><h2>Progression</h2><p>Level 1–20. General progression adds techniques, improvements, specialisation features and mastery; element progression is its own three-stage track.</p><p>Level 20 culminates in <b>KYMERA Ascension</b>.</p></div><div class="card"><h2>Synthesis</h2><p>Combine elemental tags for emergent effects. Examples: Metal + Electricity → electromagnetism; Oxygen + combustible → combustion; Gas + Area → diffusion; Radioactive + energetic → radiant surge; Life + Organic → growth.</p></div></div>`}
function openDataModal(){document.getElementById('modalbox').innerHTML=`<div class="between"><h2>Save / transfer data</h2><button class="btn" onclick="closeModal()">×</button></div><p class="small muted">Your character and campaign are stored locally in this browser. Export a JSON backup before changing device or browser.</p><div class="toolbar"><button class="btn primary" onclick="exportData()">Export JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Import JSON</button><button class="btn danger" onclick="wipeData()">Wipe local data</button></div><input id="importFile" type="file" accept="application/json" class="hide" onchange="importData(event)"><textarea id="jsonBox" placeholder="Exported JSON appears here"></textarea>`;document.getElementById('modal').classList.add('open')}
function exportData(){const s=JSON.stringify(state,null,2);document.getElementById('jsonBox').value=s;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='kymera-save.json';a.click();toast('Save exported.')}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();closeModal();render();toast('Save imported.')}catch(e){alert('Invalid KYMERA save file.')}};r.readAsText(f)}
function wipeData(){if(confirm('Delete all local KYMERA data?')){localStorage.removeItem('kymera-v4');location.reload()}}

/* ================= KYMERA v4 refinement layer ================= */
const V4_VERSION='4.0';
const V4_STAGE={1:{level:1,cost:1,name:'Awakening'},2:{level:7,cost:2,name:'Mastery'},3:{level:15,cost:3,name:'Transcendence'}};
const V4_SLOT={body:{stat:'Might',verb:'embody',focus:'force, movement, endurance and physical protection'},mind:{stat:'Intellect',verb:'interpret',focus:'perception, control, analysis and tactical manipulation'},soul:{stat:'Resonance',verb:'express',focus:'identity, life-force, space, memory and fate'}};
const FAMILY_THEMES={
 Reactive:['reflex','chain reaction','counterforce','triggered burst'],Noble:['ward','silence','sanctuary','resonant calm'],Alkali:['surge','impulse','expansion','violent release'],Metal:['structure','mass','conductivity','forged force'],Metalloid:['precision','pattern','crystal logic','adaptive edge'],Nonmetal:['adaptation','life-cycle','exchange','environmental flow'],Halogen:['corrosion','severance','purification','binding'],Lanthanide:['field','memory','radiance','magnetism'],Actinide:['decay','pressure','radiance','cataclysm'],Transactinide:['instability','threshold','collapse','impossible density']};
function v4Theme(e,i,stage,slot){let fam=e[3],ess=e[4], themes=FAMILY_THEMES[fam]||['resonance','transformation','pressure','release'];return themes[(i+stage+['body','mind','soul'].indexOf(slot))%themes.length]}
function v4Ability(code,stage,slot){
 const e=elem(code),i=E.findIndex(x=>x[0]===code),name=e[1],symbol=e[0],stateWord=e[2],family=e[3],ess=e[4],S=V4_SLOT[slot],G=V4_STAGE[stage],theme=v4Theme(e,i,stage,slot), tier=['Awaken','Master','Transcend'][stage-1];
 const names={body:[`Embodied ${ess}`,`Forged ${name}`,`${name} Incarnate`],mind:[`Calculated ${ess}`,`${name} Protocol`,`${name} Mnemonic`],soul:[`Soul-${ess}`,`${name} Communion`,`${name} Apotheosis`]}[slot];
 const effects={
  body:[`Manifest ${name} through your body. Spend 1 Body Reservoir and make a Might roll. On a success, create a ${theme} effect within 5 spaces: deal 2 damage, push 2, or gain +2 Evasion until your next turn.`,
   `Overcharge your physical resonance. Spend 2 Body Reservoir and choose two: deal 5 damage, move 4 spaces without provoking, gain 3 temporary HP, or force a target to become Exposed. If you roll 18+, choose three.`,
   `Become the living expression of ${name}. Spend 3 Body Reservoir; for one scene your first successful ${theme} action each round creates a second linked effect. Once during the scene, reduce incoming damage by 5 and push the source 2 spaces.`],
  mind:[`Interpret ${name} as a mental instrument. Spend 1 Mind Reservoir and make an Intellect roll. On a success, read one target's intent, reveal a hidden resonance, or impose Marked for 1 round.`,
   `Run the ${name} pattern through your mind. Spend 2 Mind Reservoir and choose two: scan 10 spaces, impose Stunned for 1 round on a failed Will save, redirect a zone, or grant an ally +2 on their next roll.`,
   `Enter ${name} Mnemonic. Spend 3 Mind Reservoir; for one scene you can treat one failed Perception or Intellect roll as a partial success. Once per round you may reposition a visible ally 2 spaces as a mental command.`],
  soul:[`Let your soul resonate as ${name}. Spend 1 Soul Reservoir and make a Resonance roll. On a success, create a brief ${theme} link: heal 2 HP, teleport 2 spaces, or gain Shielded until your next turn.`,
   `Open a deeper communion with ${name}. Spend 2 Soul Reservoir and choose two: heal 5 HP, teleport 5 spaces, clear Frightened, or create a 3-space resonance zone for 1 round.`,
   `Cross the threshold of ${name}. Spend 3 Soul Reservoir; for one scene your soul effects can target through line-of-sight barriers. Once during the scene, when an ally would fall to 0 HP, they instead remain at 1 HP and become Shielded.`]
 };
 const unlock=stage===1?'Your first rite of attunement.':stage===2?'Your element has become a mastered discipline.':'The element is no longer merely wielded; it is part of what you are.';
 return {id:`${symbol}-${slot}-${stage}`,code,symbol,name,slot,stage,level:G.level,cost:G.cost,title:names[stage-1],effect:effects[slot][stage-1],twist:`${slotLabel(slot)} expression: ${S.focus}.`,theme,tag:ess,family,stateWord,lore:unlock};
}
function allV4Abilities(){return E.flatMap(e=>['body','mind','soul'].flatMap(s=>[1,2,3].map(st=>v4Ability(e[0],st,s))))}
const V4_ELEMENT_ABILITIES=allV4Abilities();
function elementAbility(code,stage,slot){return v4Ability(code,stage,slot)}
function v4CreatorValid(){const c=state.creator;return c.name.trim()&&c.origin&&c.calling&&Object.values(c.slots).every(Boolean)&&c.archetype&&c.specialisation&&Object.values(c.stats).reduce((a,b)=>a+b,0)===3}
function startCreator(){state.page='character';state.creator.step=Math.max(1,state.creator.step||1);save();render()}
function creatorStep(i){state.creator.step=i;save();renderCharacter()}
function renderSteps(){const names=['Concept','Origin & Calling','Stats','Birth Elements','Attunement','Archetype','Review'];return `<aside class="creator-sidebar">${names.map((n,i)=>`<button class="creator-step-card ${state.creator.step===i+1?'active':''} ${state.creator.step>i+1?'done':''}" onclick="creatorStep(${i+1})"><span class="stepnum">${i+1}</span><b>${n}</b><div class="small muted">${state.creator.step>i+1?'Complete':state.creator.step===i+1?'Current':'Locked'}</div></button>`).join('')}</aside>`}
function creatorNext(){const c=state.creator;
 if(c.step===1&&!c.name.trim())return toast('Name your character before continuing.');
 if(c.step===2&&(!c.origin||!c.calling))return toast('Choose an origin and calling.');
 if(c.step===3&&Object.values(c.stats).reduce((a,b)=>a+b,0)!==3)return toast('Use the full +2, +1, +1, 0, 0, -1 spread.');
 if(c.step===4&&c.elements.length!==3)return toast('Your birth set must contain three distinct elements.');
 if(c.step===5&&Object.values(c.slots).some(x=>!x))return toast('Attune one element to each of Body, Mind and Soul.');
 if(c.step===6&&(!c.archetype||!c.specialisation))return toast('Choose an archetype and specialisation.');
 c.step=Math.min(7,c.step+1);save();renderCharacter()}
function creatorBack(){state.creator.step=Math.max(1,state.creator.step-1);save();renderCharacter()}
function v4Assign(slot,code){const c=state.creator;if(!c.elements.includes(code))return;for(const s of ['body','mind','soul'])if(c.slots[s]===code)c.slots[s]=null;c.slots[slot]=code;save();renderCharacter()}
function v4Unassign(slot){state.creator.slots[slot]=null;save();renderCharacter()}
function rerollBirth(){const c=state.creator;if(c.rerolls<=0)return toast('No birth rerolls remain.');c.elements=randomBirthSet();c.slots={body:null,mind:null,soul:null};c.rerolls--;save();renderCharacter();toast(`Birth set rerolled. ${c.rerolls} reroll${c.rerolls===1?'':'s'} remaining.`)}
function v4SetStat(s,v){const c=state.creator;const old=c.stats[s],next=clamp(v,-1,2);const vals=Object.values(c.stats);if(next>old){const positive=vals.filter(x=>x>0).reduce((a,b)=>a+b,0);if(positive+(next-old)>4)return toast('You can only have one +2 and two +1 stats.')}c.stats[s]=next;const counts={'2':Object.values(c.stats).filter(x=>x===2).length,'1':Object.values(c.stats).filter(x=>x===1).length,'-1':Object.values(c.stats).filter(x=>x===-1).length};if(counts[2]>1||counts[1]>2||counts[-1]>1){c.stats[s]=old;return toast('That would break the starting stat spread.')}save();renderCharacter()}
function chooseArch(a){state.creator.archetype=a;if(!SPECS.includes(state.creator.specialisation))state.creator.specialisation=SPECS[0];save();renderCharacter()}
function finishCreation(){if(!v4CreatorValid())return toast('Finish every required choice before creating the character.');const c=state.creator;const old=state.character||{};state.character={...old,created:true,level:1,xp:0,hp:14,maxHp:14,hope:2,overload:0,res:{body:5,mind:5,soul:5},conditions:[],techniques:[],equipment:[],equipmentSlots:{main:null,off:null,armor:null,core:null},activeTab:'sheet',defeats:0};state.page='character';save();render();toast('Character created. Welcome to KYMERA.')}
function renderCreator(){const c=state.creator;let body='';
 if(c.step===1)body=`<div class="kicker">Step 1 of 7 · Concept</div><h1 class="title">Create your character</h1><p class="subtitle">Start with the person. Every mechanical choice can be reviewed before the final creation button.</p><div class="formgrid section"><div class="field"><label>Character name *</label><input value="${esc(c.name)}" oninput="state.creator.name=this.value;save()" placeholder="e.g. Kael Voss"></div><div class="field"><label>Pronouns</label><input value="${esc(c.pronouns)}" oninput="state.creator.pronouns=this.value;save()" placeholder="Optional"></div><div class="field"><label>Age</label><input type="number" min="13" value="${c.age}" oninput="state.creator.age=Math.max(13,+this.value||13);save()"></div></div><div class="field"><label>Appearance & first impression</label><textarea oninput="state.creator.description=this.value;save()" placeholder="What do people notice first?">${esc(c.description)}</textarea></div><div class="formgrid"><div class="field"><label>Goals</label><textarea oninput="state.creator.goals=this.value;save()">${esc(c.goals)}</textarea></div><div class="field"><label>Bonds</label><textarea oninput="state.creator.bonds=this.value;save()">${esc(c.bonds)}</textarea></div><div class="field"><label>Flaws</label><textarea oninput="state.creator.flaws=this.value;save()">${esc(c.flaws)}</textarea></div></div>`;
 else if(c.step===2)body=`<div class="kicker">Step 2 of 7 · Origin & Calling</div><h1 class="title">What shaped you?</h1><p class="subtitle">Choose the culture that raised you, then the calling you pursued. These choices affect your starting identity and playstyle.</p><h2 class="section">Origin</h2><div class="choicegrid">${ORIGINS.map(o=>`<button class="choice big ${c.origin===o[0]?'selected':''}" onclick="state.creator.origin='${esc(o[0])}';save();renderCharacter()"><span class="check">${c.origin===o[0]?'✓':''}</span><b>${esc(o[0])}</b><div class="desc">${esc(o[1])}</div><div class="tags"><span class="pill">${esc(o[2])}</span></div></button>`).join('')}</div><h2 class="section">Calling</h2><div class="choicegrid">${CALL.map(o=>`<button class="choice ${c.calling===o[0]?'selected':''}" onclick="state.creator.calling='${esc(o[0])}';save();renderCharacter()"><span class="check">${c.calling===o[0]?'✓':''}</span><b>${esc(o[0])}</b><div class="desc">${esc(o[1])}</div></button>`).join('')}</div>`;
 else if(c.step===3){const sum=Object.values(c.stats).reduce((a,b)=>a+b,0);body=`<div class="kicker">Step 3 of 7 · Stats</div><h1 class="title">Build your core</h1><p class="subtitle">Starting spread: <b>+2, +1, +1, 0, 0, -1</b>. Tap a value to cycle it; the builder will prevent an illegal starting spread.</p><div class="grid g3 section">${STATS.map(s=>`<div class="stat"><div class="between"><b>${s}</b><span class="pill">${c.stats[s]>=0?'+':''}${c.stats[s]}</span></div><div class="toolbar"><button class="btn" onclick="v4SetStat('${s}',${c.stats[s]-1})">−</button><button class="btn primary" onclick="v4SetStat('${s}',${c.stats[s]+1})">+</button></div><div class="small muted">${s==='Resonance'?'Your direct interface with elemental power.':s==='Might'?'Force, endurance and physical impact.':s==='Agility'?'Movement, reflex and precision.':s==='Intellect'?'Analysis, synthesis and technical reasoning.':s==='Perception'?'Awareness, senses and reading resonance.':'Influence, command and social force.'}</div></div>`).join('')}</div><div class="card section"><div class="between"><b>Starting spread check</b><span class="pill">${sum===3?'Valid':'Incomplete'}</span></div><div class="tags">${STATS.map(s=>`<span class="pill">${s}: ${c.stats[s]>=0?'+':''}${c.stats[s]}</span>`).join('')}</div><p class="small muted">You must have exactly one +2, two +1s, two 0s and one −1.</p></div>`}
 else if(c.step===4){const els=c.elements.map(elem);body=`<div class="kicker">Step 4 of 7 · Birth Elements</div><h1 class="title">The elements choose you.</h1><p class="subtitle">Your three birth elements are <b>randomly determined</b>. You never select them directly. You have two complete rerolls during character creation.</p><div class="rollbox section"><div><div class="muted small">Current birth resonance</div><div class="dice">${els.map(x=>esc(x[0])).join(' · ')}</div><div class="tags">${els.map(x=>`<span class="pill">${esc(x[1])} · ${esc(x[4])}</span>`).join('')}</div></div><button class="btn reroll" ${c.rerolls<=0?'disabled':''} onclick="rerollBirth()">Reroll entire set · ${c.rerolls} left</button></div><div class="birth-grid section">${els.map(e=>`<div class="birth-card"><div class="between"><span class="pill">${esc(e[0])}</span><span class="pill">${esc(e[2])}</span></div><h3>${esc(e[1])}</h3><div class="small muted">${esc(e[3])} · ${esc(e[4])}</div><p class="small">This is part of your birth identity. Your choice comes next: Body, Mind or Soul.</p></div>`).join('')}</div>`}
 else if(c.step===5){body=`<div class="kicker">Step 5 of 7 · Attunement at thirteen</div><h1 class="title">Choose where each element lives.</h1><p class="subtitle">The elements were given to you at birth. At thirteen, the rite of age lets you decide which one becomes <b>Body</b>, which becomes <b>Mind</b>, and which becomes <b>Soul</b>. This is the defining choice of your character.</p><div class="slot-picker section">${['body','mind','soul'].map(slot=>{const code=c.slots[slot],e=code&&elem(code);return `<div class="slot-drop ${code?'filled':''}"><div class="slot-symbol">${slot==='body'?'B':slot==='mind'?'M':'S'}</div><span class="kicker">${slotLabel(slot)}</span><h2>${e?esc(e[1]):'Unattuned'}</h2><p class="small muted">${V4_SLOT[slot].focus}</p>${e?`<div class="tags"><span class="pill">${esc(e[4])}</span><span class="pill">${V4_STAGE[1].cost} Reservoir at Lv 1</span></div><button class="btn section" onclick="v4Unassign('${slot}')">Change attunement</button>`:'<span class="pill">Assign an element below</span>'}</div>`}).join('')}</div><h2 class="section">Your three birth elements</h2><div class="birth-grid">${c.elements.map(code=>{const e=elem(code),used=Object.values(c.slots).includes(code);return `<div class="birth-card"><div class="between"><b>${esc(e[1])}</b><span class="pill">${esc(e[0])}</span></div><div class="small muted">${esc(e[3])} · ${esc(e[4])}</div><div class="assign-row">${['body','mind','soul'].map(s=>`<button class="btn ${c.slots[s]===code?'primary':''}" onclick="v4Assign('${s}','${code}')">${c.slots[s]===code?'✓ ':''}${slotLabel(s)}</button>`).join('')}</div><div class="small muted section">${used?'Currently attuned — choosing another slot moves it.':'Choose its final slot.'}</div></div>`}).join('')}</div>`}
 else if(c.step===6)body=`<div class="kicker">Step 6 of 7 · Archetype</div><h1 class="title">Define your combat identity.</h1><p class="subtitle">Your archetype is the chassis. Your specialisation is the branch. Your elements then modify how that chassis actually behaves.</p><div class="choicegrid section">${ARCH.map(a=>`<button class="choice big ${c.archetype===a[0]?'selected':''}" onclick="chooseArch('${esc(a[0])}')"><span class="check">${c.archetype===a[0]?'✓':''}</span><b>${esc(a[0])}</b><div class="desc">${esc(a[1])}</div><p class="small muted">${esc(a[2])}</p></button>`).join('')}</div><h2 class="section">Specialisation</h2><div class="choicegrid">${SPECS.map(sp=>`<button class="choice ${c.specialisation===sp?'selected':''}" onclick="state.creator.specialisation='${esc(sp)}';save();renderCharacter()"><span class="check">${c.specialisation===sp?'✓':''}</span><b>${esc(sp)}</b><div class="desc">Focused tactical branch of the KYMERA chassis.</div></button>`).join('')}</div>`;
 else {body=`<div class="kicker">Step 7 of 7 · Final Review</div><h1 class="title">Your KYMERA is ready.</h1><p class="subtitle">Review every major decision before you create the permanent interactive sheet.</p><div class="grid g2 section"><div class="card"><h2>${esc(c.name||'Unnamed')}</h2><p class="muted">${esc(c.origin)} · ${esc(c.calling)}</p><div class="tags"><span class="pill">${esc(c.archetype)}</span><span class="pill">${esc(c.specialisation)}</span></div><div class="statgrid section">${STATS.map(s=>`<div class="statbox"><span class="small muted">${s}</span><b>${c.stats[s]>=0?'+':''}${c.stats[s]}</b></div>`).join('')}</div></div><div class="card"><h2>Attunement</h2>${['body','mind','soul'].map(s=>`<div class="element-chip"><b>${slotLabel(s)}</b><span>${esc(elem(c.slots[s])[1])}</span></div>`).join('')}<div class="mastery-strip section">${[1,2,3].map(st=>`<div class="mastery-mini ${st===1?'on':''}"><b>Stage ${st}</b><div class="small muted">Level ${V4_STAGE[st].level} · ${V4_STAGE[st].cost} Reservoir</div></div>`).join('')}</div></div></div><div class="card section"><h2>Creation checklist</h2><div class="tags"><span class="pill">✓ Identity</span><span class="pill">✓ Origin</span><span class="pill">✓ Calling</span><span class="pill">✓ Stats</span><span class="pill">✓ Random birth set</span><span class="pill">✓ Body/Mind/Soul attunement</span><span class="pill">✓ Archetype</span><span class="pill">✓ Specialisation</span></div><button class="btn primary section" onclick="finishCreation()">Create Level 1 character</button></div>`}
 document.getElementById('character').innerHTML=`<div class="creator-shell">${renderSteps()}<div class="creator-main"><div class="card builder-pane">${body}<div class="builder-nav"><button class="btn" ${c.step===1?'disabled':''} onclick="creatorBack()">Back</button>${c.step<7?`<button class="btn primary" onclick="creatorNext()">Continue</button>`:''}</div></div></div></div>`}
function v4Derived(){const c=state.creator,ch=state.character;return {evasion:10+(c.stats.Agility||0),resistance:10+(c.stats.Might||0),will:10+(c.stats.Resonance||0),initiative:10+(c.stats.Perception||0),power:Math.max(0,1+(c.stats.Resonance||0)),speed:5+(c.stats.Agility||0)}}
function spendResource(slot,n){const r=state.character.res;if(r[slot]<n)return false;r[slot]-=n;save();return true}
function useElementAbility(slot,stage){const code=state.creator.slots[slot],a=v4Ability(code,stage,slot);if(state.character.level<a.level)return toast(`Unlocks at level ${a.level}.`);if(!spendResource(slot,a.cost))return toast(`Not enough ${slotLabel(slot)} Reservoir.`);state.character.lastAbility=a.id;save();renderSheet();toast(`${a.title} used · −${a.cost} ${slotLabel(slot)} Reservoir`)}
function rollCheck(stat,bonus=0){const d1=Math.ceil(Math.random()*20),v=d1+(state.creator.stats[stat]||0)+bonus;let outcome=d1===20?'Critical success':d1===1?'Complication':v>=13?'Success':'Failure';const log=`${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${stat} · d20 ${d1} + ${state.creator.stats[stat]||0} = ${v} · ${outcome}`;state.character.rollLog=[log,...(state.character.rollLog||[])].slice(0,12);save();renderSheet();toast(`${stat}: ${v} · ${outcome}`)}
function v4Heal(n){state.character.hp=clamp(state.character.hp+n,0,state.character.maxHp);save();renderSheet()}
function v4Damage(n){state.character.hp=clamp(state.character.hp-n,0,state.character.maxHp);if(state.character.hp===0)state.character.defeats=(state.character.defeats||0)+1;save();renderSheet()}
function v4SetLevel(l){l=clamp(+l,1,20);state.character.level=l;state.character.maxHp=14+(l-1)*2;state.character.hp=clamp(state.character.hp,state.character.maxHp>0?1:0,state.character.maxHp);save();renderSheet();toast(`Level set to ${l}.`)}
function gainXp(n){state.character.xp=(state.character.xp||0)+n;while(state.character.level<20&&state.character.xp>=levelXp(state.character.level+1))state.character.level++;state.character.maxHp=14+(state.character.level-1)*2;state.character.hp=Math.min(state.character.maxHp,state.character.hp+2);save();renderSheet()}
function v4Condition(c){const a=state.character.conditions||[],i=a.indexOf(c);i>=0?a.splice(i,1):a.push(c);save();renderSheet()}
function v4SpendHope(){if(state.character.hope<=0)return toast('No Hope remaining.');state.character.hope--;save();renderSheet();toast('Hope spent.')}
function v4GainHope(){state.character.hope=clamp(state.character.hope+1,0,6);save();renderSheet()}
